[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qr-multi-imgs"
version = "0.9.0"
description = "Enhanced QR Code Scanner for Images - detects blurry, small, rotated, and difficult QR codes"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "thousandflowers"},
]
keywords = ["qr", "barcode", "scanner", "detection", "image"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "pyzbar>=0.1.9",
    "Pillow>=10.0.0",
    "qrcode>=7.4.2",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "basedpyright>=1.39"]
deep = ["qreader>=0.1.0"]

[project.urls]
Homepage = "https://github.com/thousandflowers/qr-multi-imgs"
Repository = "https://github.com/thousandflowers/qr-multi-imgs"
Issues = "https://github.com/thousandflowers/qr-multi-imgs/issues"

[project.scripts]
qr-multi-imgs = "qr_multi_imgs:main"

[tool.setuptools]
py-modules = ["qr_multi_imgs"]
include-package-data = true
