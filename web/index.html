<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing leaves the machine, and that is enforced rather than promised:
     connect-src allows only this page's own origin (for the wasm engine) and
     the loopback, so the page cannot send a filename or a payload anywhere
     else. No font, script or image is fetched from any third party. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
  style-src 'unsafe-inline';
  img-src 'self' data: blob:;
  media-src blob:;
  connect-src 'self' http://127.0.0.1:* http://localhost:*;
  worker-src 'self';
  base-uri 'none';
  form-action 'none'">
<title>QR Code Scanner</title>
<meta name="description" content="Read, filter and export every QR code in a folder of images. Runs entirely in your browser - nothing is uploaded, nothing to install.">
<style>
:root {
  color-scheme: light;

  /* TYPE SCALE — seven steps, ratio 1.2 from a 16px base.
     Before this the page used 24 distinct font sizes, eleven of which differed
     from a neighbour by less than one pixel (.68 / .69 / .70 / .71 / .72 / .73
     rem). Distinctions the eye cannot resolve are not hierarchy, they are
     noise, and they make every new element a fresh decision. */
  --fs-1: 0.75rem;    /* 12px — micro labels */
  --fs-2: 0.8125rem;  /* 13px — captions, chips */
  --fs-3: 0.875rem;   /* 14px — secondary text */
  --fs-4: 1rem;       /* 16px — body */
  --fs-5: 1.1875rem;  /* 19px — subheads */
  --fs-6: 1.5rem;     /* 24px — section titles */
  --fs-7: 2rem;       /* 32px — the one hero line */

  /* Line heights land on a 4px grid so stacked text keeps a vertical rhythm
     and the eye returns reliably to the start of the next line. */
  --lh-1: 1rem; --lh-2: 1.25rem; --lh-3: 1.5rem; --lh-4: 1.75rem; --lh-5: 2.25rem;

  /* SPACING — 4/8pt grid, the scale Apple and Google both build on. The page
     had twenty spacing values including .28rem and .45rem, which is not a
     system, it is an accumulation. */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px;
  --s-6:24px; --s-7:32px; --s-8:48px;

  /* MEASURE — prose stops at a comfortable line length instead of running the
     full width of a wide window. */
  --measure: 68ch;

  /* COLOUR. Every text pair below clears WCAG 2.2 AA (4.5:1) against the
     LIGHTEST surface it can sit on, not just against the panel. --faint failed
     that badly: 2.64:1 on white, 2.35:1 on the soft surface. Raising it to
     pass put it within a hair of --dim, which is the honest answer — there was
     never room for three legible greys here. So there are two text greys now,
     and --faint is demoted to non-text use (icons, rules, dividers) where the
     3:1 rule for UI components applies. */
  --bg:#f2f4f8; --panel:#fff; --fg:#0f1319;
  --dim:#686f7b;      /* 5.06:1 on white, 4.52:1 on --soft */
  --faint:#7d8695;    /* NON-TEXT ONLY: rules and icons */
  --line:#e2e6ee; --soft:#f2f4f8;

  /* Accents at the highest saturation that still clears AA. Each one is the
     BRIGHTEST colour at its hue and saturation that holds 4.5:1 against the
     lightest surface it can sit on - found by walking the lightness rather
     than by eye, so "more vivid" stops exactly where legible stops. */
  --brand:#3f62f1; --brand-fg:#fff; --brand-soft:#f1f4fe;   /* 4.51:1 */
  --ok:#0e813e;    --ok-soft:#d9fce7;                        /* 4.51:1 */
  --bad:#d72a1b;   --bad-soft:#fef2f1;                       /* 4.50:1 */
  --warn:#a95c04;  --warn-soft:#fdf2e5;                      /* 4.52:1 */

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, ui-sans-serif, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --radius:12px;
}
/* Dark is no longer what the OS setting picks - the page is a light page now.
   It is kept, not deleted: set data-theme="dark" on <html> and it comes back
   whole. Nothing here is dead, it is just not the default. */
:root[data-theme="dark"] {
    /* Material's advice for dark surfaces: a dark grey rather than pure black,
       lighter overlays for elevation, and desaturated accents — a saturated
       hue that reads well on white glares on a dark ground. */
    --bg:#0f1216; --panel:#171b21; --fg:#e7eaef;
    --dim:#9aa3b0;      /* 6.78:1 on --panel */
    --faint:#818996;    /* 4.53:1 on --soft — was 3.39:1 */
    --line:#262c35; --soft:#1d222a;
    --brand:#6180fa;    /* 4.52:1 on --brand-soft — was 4.32:1 */
    --brand-fg:#0f1216; --brand-soft:#1b2233;
    --ok:#69c48c; --ok-soft:#16281d; --bad:#e8776a; --bad-soft:#2a1b19;
    --warn:#e0b062; --warn-soft:#2a2314;
}
* { box-sizing:border-box; }
/* Prose stops at a comfortable line length. The advice under a row was running
   the full width of a wide window, which is roughly 110 characters - past the
   point where the eye reliably finds the start of the next line. */
.advice, .empty p, #inspHint, #inspKeys { max-width:var(--measure); }
.empty p { margin-left:auto; margin-right:auto; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:var(--fs-4)/var(--lh-3) var(--sans);
  /* Numbers in the tiles change as a scan runs; tabular figures stop them
     jittering sideways every time a digit lands. */
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100%; }
a { color:var(--brand); }

html { scroll-padding-top:64px; }  /* the sticky header must not cover what is scrolled to */
header { position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--line); }
.bar { max-width:78rem; margin:0 auto; padding:12px 16px;
  display:flex; align-items:center; gap:16px; }
.brand { display:flex; align-items:center; gap:8px; font-weight:700;
  letter-spacing:-.02em; font-size:var(--fs-4); text-decoration:none; color:var(--fg); }
.brand svg { width:21px; height:21px; flex:none; color:var(--brand); }
.brand em { font-style:normal; color:var(--dim); font-weight:500; font-size:var(--fs-3); }
/* The source link and the language picker are unrelated controls that happened
   to sit 12px apart, close enough to read as one group. Separated properly. */
.bar nav { margin-left:auto; display:flex; align-items:center; gap:32px; font-size:var(--fs-3); }
.bar nav a { color:var(--dim); text-decoration:none; display:inline-flex; align-items:center; }
.bar nav a:hover { color:var(--fg); }
/* The mark, not the word: everyone recognises it, and it reads the same in
   every one of the six languages. The accessible name still says "source". */
.ghlink svg { width:20px; height:20px; }
.lang { font-size:var(--fs-2); padding:4px 8px; border-radius:7px;
  border:1px solid var(--line); background:var(--panel); color:var(--dim); }

main { flex:1; max-width:78rem; width:100%; margin:0 auto; padding:32px 16px 48px; }
.hero { text-align:center; margin-bottom:24px; }
.hero h1 { font-size:var(--fs-7); line-height:1.15; letter-spacing:-.03em; margin:0 0 8px; }
.hero p { margin:0 auto; max-width:44rem; color:var(--dim); font-size:var(--fs-4); }
.trust { display:inline-flex; align-items:center; gap:8px; margin-top:12px;
  padding:4px 12px; border-radius:99px; background:var(--ok-soft); color:var(--ok);
  font-size:var(--fs-2); font-weight:600; }
.trust svg { width:13px; height:13px; }

/* The two macro areas want to read as two, so the gap between them is larger
   than any gap inside either. */
/* The two macro areas want to read as two, so the gap between them - and
   between the columns - is larger than any gap inside either. */
.tool { display:grid; grid-template-columns:22rem 1fr; gap:32px 24px; align-items:start; }
@media (max-width:900px) { .tool { grid-template-columns:1fr; } main { padding:20px 12px 48px; }
  .hero h1 { font-size:var(--fs-6); } }

.panel { background:var(--panel); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden; }
.phead { display:flex; align-items:center; gap:8px; padding:0 16px;
  border-bottom:1px solid var(--line); flex-wrap:wrap; }
.phead h2 { font-size:var(--fs-4); margin:0; padding:12px 0; font-weight:600; }
.pill { margin-left:auto; font-size:var(--fs-1); font-weight:600; color:var(--dim);
  display:inline-flex; align-items:center; gap:4px; }
.pill b { color:var(--ok); }
.pbody { padding:12px; }

.tabs { display:flex; gap:4px; padding:0 4px; border-bottom:1px solid var(--line); }
.tab { appearance:none; border:0; background:none; font:inherit; font-size:var(--fs-3);
  color:var(--dim); padding:12px 12px; cursor:pointer; border-bottom:2px solid transparent;
  display:flex; align-items:center; gap:8px; }
.tab svg { width:15px; height:15px; }
.tab[aria-selected="true"] { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }

#drop { border:2px dashed var(--line); border-radius:10px; background:var(--soft);
  padding:24px 16px; text-align:center;
  transition:border-color .12s, background .12s, padding .18s ease; }
/* Once there are results, the invitation to drop files has done its job and
   stops taking a third of the column to keep saying it. It still accepts a
   drop, and still grows back when the list is cleared. */
#drop.tight { padding:12px 12px; }
#drop.tight .ico { width:22px; height:22px; margin-bottom:4px; }
#drop.tight small, #drop.tight .formats { display:none; }
#drop.over { border-color:var(--brand); background:var(--brand-soft); }
#drop .ico { width:36px; height:36px; margin:0 auto 8px; color:var(--faint); display:block; }
#drop.over .ico { color:var(--brand); }
#drop strong { display:block; font-size:var(--fs-4); margin-bottom:4px; }
#drop small { color:var(--dim); font-size:var(--fs-2); }
.formats { margin-top:12px; font-size:var(--fs-1); color:var(--dim); font-family:var(--mono); }

.bi { width:16px; height:16px; flex:none; }
button { font:inherit; font-size:var(--fs-3); padding:8px 12px; border-radius:8px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:4px; }
button:hover:not(:disabled) { border-color:var(--brand); color:var(--brand); }
button:disabled { opacity:.45; cursor:not-allowed; }
button.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-fg); }
button.primary:hover:not(:disabled) { filter:brightness(1.08); color:var(--brand-fg); }
button.danger:hover:not(:disabled) { border-color:var(--bad); color:var(--bad); }
.actions { display:grid; grid-template-columns:1fr; gap:8px; margin-top:12px; }
/* One column, not two. At this panel width a label like "Scegli una cartella"
   plus its icon does not fit on one line, and four buttons each wrapping to two
   lines is a ragged block. Stacked and left-aligned they read as a list of ways
   in, which is what they are. */
.actions button { justify-content:flex-start; padding:10px 12px; }
.actions .span2 { grid-column:auto; }
.actions .span2 { grid-column:1 / -1; }
input[type=file] { display:none; }
#shootWrap { display:none; }
@media (hover:none) and (pointer:coarse) { #shootWrap { display:block; } }

/* The decoder's own state, as a card rather than a line of grey monospace.
   It is the one thing on the page that says whether anything will work at all,
   and it earns a colour: neutral while it loads, green once it can decode, red
   if it never arrives. */
#engine { margin-left:12px; padding:4px 10px; border-radius:999px;
  border:1px solid var(--line); background:var(--soft); color:var(--dim);
  font-size:var(--fs-2); white-space:nowrap;
  display:inline-flex; align-items:center; gap:8px; }
#engine::before { content:""; width:8px; height:8px; border-radius:50%;
  background:currentColor; opacity:.5; flex:none; }
#engine.ready { border-color:var(--ok); background:var(--ok-soft); color:var(--ok);
  font-weight:600; }
#engine.ready::before { opacity:1; }
#engine.failed { border-color:var(--bad); background:var(--bad-soft); color:var(--bad); }
#engine.failed::before { opacity:1; }

#camWrap { border-radius:10px; overflow:hidden; background:#000; aspect-ratio:4/3;
  display:flex; align-items:center; justify-content:center; }
#cam { width:100%; height:100%; object-fit:cover; }
#camOff { color:#8b93a1; font-size:var(--fs-3); text-align:center; padding:16px; }
#camMsg { margin-top:8px; font-size:var(--fs-2); color:var(--dim); text-align:center; min-height:1.2em; }

#work { padding:8px 16px; border-bottom:1px solid var(--line); background:var(--soft); }
#bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
#bar i { display:block; height:100%; width:0; background:var(--brand); transition:width .1s linear; }
#count { margin-top:4px; font-size:var(--fs-1); color:var(--dim); font-family:var(--mono);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr));
  border-bottom:1px solid var(--line); }
.stats .hide { display:none; }
/* Visible to a screen reader, not on screen. */
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
#renameEg { font-size:var(--fs-2); color:var(--dim); font-family:var(--mono);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:22rem; }
#nowFile { padding:4px 12px 0; font-size:var(--fs-2); color:var(--dim);
  font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#nowFile.slow { color:var(--warn); font-family:var(--sans); }
/* Two bars, not one. Narrowing the list and taking it away are different
   kinds of act and now look like it. */
.bar2 { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:12px 16px; border-bottom:1px solid var(--line); }
.bar2 .barLabel { font-size:var(--fs-2); color:var(--dim); min-width:4.5rem; }
.exports { background:var(--soft); }
/* Secondary actions look like their labels: one primary act per bar. */
button.quiet { background:none; border-color:transparent; color:var(--dim); }
button.quiet:hover:not(:disabled) { background:var(--panel); border-color:var(--line); color:var(--fg); }
#renameWrap { border-bottom:1px solid var(--line); }
#renameWrap summary { padding:12px 16px; cursor:pointer; font-size:var(--fs-2); color:var(--dim); }
#renameWrap summary:hover { color:var(--brand); }
#renameWrap[open] summary { color:var(--fg); }
#renameWrap .bar2 { border-bottom:0; padding-top:0; }
/* Air between the controls and what they act on. */
ul { margin-top:8px; }
#summary { padding:8px 12px 0; color:var(--dim); font-size:var(--fs-2); }
/* A payload that is a link looks like one but is a button: see the note where
   it is built. */
.linkish { background:none; border:0; padding:0; color:var(--brand);
  text-decoration:underline; cursor:pointer; text-align:left; font:inherit;
  font-family:var(--mono); font-size:var(--fs-2); word-break:break-all; }
.chip { font-size:var(--fs-2); padding:4px 8px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer; }
.chip[aria-pressed="true"] { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); }
.stats div { padding:12px 8px; text-align:center; border-right:1px solid var(--line); }
.stats div:last-child { border-right:0; }
.stats b { display:block; font-size:var(--fs-5); font-weight:650; line-height:1.2; }
.stats span { font-size:var(--fs-1); color:var(--dim); }
.stats .hit b { color:var(--ok); }
.stats .warn b { color:var(--warn); }

.toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  padding:12px 16px; border-bottom:1px solid var(--line); }
select, input[type=search] { font:inherit; font-size:var(--fs-3); padding:8px 8px; height:36px;
  border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); }
input[type=search] { flex:1; min-width:9rem; }
.grow { flex:1; }

.nomatch { margin:0; padding:32px 16px; text-align:center; color:var(--dim); font-size:var(--fs-3); }
.empty { padding:48px 20px; text-align:center; color:var(--dim); }
.empty svg { width:42px; height:42px; margin-bottom:12px; opacity:.5; }
/* margin:0 here used to clobber the auto side margins set with the measure
   above, so the 68ch box hugged the left edge and the centred text inside it
   sat off-centre. */
.empty p { margin:0 auto; font-size:var(--fs-4); }

ul { list-style:none; margin:0; padding:0; max-height:38rem; overflow-y:auto;
     display:flex; flex-direction:column; }
li { display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
li img { width:72px; height:72px; object-fit:cover; border-radius:9px;
  background:var(--soft); flex:none; }
li .noimg { width:72px; height:72px; border-radius:9px; background:var(--soft); flex:none; }
.meta { min-width:0; flex:1; }
.nameline { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.name { font-size:var(--fs-3); font-weight:600; word-break:break-all; }
.where { font-family:var(--mono); font-size:var(--fs-1); color:var(--dim); word-break:break-all; }
.renamed { font-size:var(--fs-1); color:var(--dim); margin-top:4px; }
.renamed code { font-family:var(--mono); background:var(--soft); padding:4px 4px;
  border-radius:4px; word-break:break-all; }

.hitbox { margin-top:8px; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.hitTop { display:flex; align-items:center; gap:8px; padding:8px 8px;
  background:var(--soft); flex-wrap:wrap; }
.kind { display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-1);
  font-weight:600; color:var(--brand); }
.kind svg { width:13px; height:13px; }
.dupe { font-size:var(--fs-1); font-weight:600; color:var(--warn); background:var(--warn-soft);
  padding:4px 8px; border-radius:5px; }
.hitTop .grow { flex:1; }
.hitTop button { padding:4px 8px; font-size:var(--fs-1); }
.fields { padding:8px 8px; display:grid; gap:4px; }
.field { display:flex; gap:8px; font-size:var(--fs-2); align-items:baseline; }
.field .k { color:var(--dim); min-width:6.5rem; flex:none; font-size:var(--fs-1); }
.field .v { font-family:var(--mono); word-break:break-all; flex:1; }
.field a.v { color:var(--brand); text-decoration:none; }
.field a.v:hover { text-decoration:underline; }
.field.secret .v { letter-spacing:.08em; }
.field button { padding:4px 8px; font-size:var(--fs-1); flex:none; }

.tagline { display:inline-block; margin-top:4px; font-size:var(--fs-1);
  padding:4px 8px; border-radius:5px; }
.tagline.no { background:var(--soft); color:var(--dim); }
.tagline.found { background:var(--warn-soft); color:var(--warn); }
.tagline.err { background:var(--bad-soft); color:var(--bad); }
.advice { margin-top:4px; font-size:var(--fs-2); color:var(--dim); }

textarea { width:100%; min-height:3.5rem; font-family:var(--mono); font-size:var(--fs-3);
  background:var(--bg); color:var(--fg); border:1px solid var(--line);
  border-radius:8px; padding:8px 8px; resize:vertical; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
#localMsg { white-space:pre-wrap; font-family:var(--mono); font-size:var(--fs-2); margin-top:8px; }

footer { border-top:1px solid var(--line); background:var(--panel); }
.fbar { max-width:78rem; margin:0 auto; padding:16px 16px; display:flex;
  gap:16px; flex-wrap:wrap; align-items:center; font-size:var(--fs-2); color:var(--dim); }
.fbar a { color:var(--dim); }

.hide { display:none !important; }

/* the working bar: progress, counter, and the one destructive control */
#work { padding:8px 16px; border-bottom:1px solid var(--line); background:var(--soft);
  position:relative; }
.workRow { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
#count { font-size:var(--fs-2); color:var(--dim); font-family:var(--mono);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#work button.danger { padding:4px 8px; font-size:var(--fs-2); color:var(--bad);
  border-color:var(--bad-soft); background:var(--bad-soft); }
#work button.danger:hover { border-color:var(--bad); }
#bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
#bar i { display:block; height:100%; width:0; background:var(--brand); transition:width .18s ease; }
#bar.done i { background:var(--ok); }

.pop { position:absolute; right:.75rem; top:2.4rem; z-index:9; background:var(--panel);
  border:1px solid var(--line); border-radius:10px; padding:12px 12px;
  box-shadow:0 8px 24px rgba(0,0,0,.14); width:15rem;
  animation:popIn .12s ease-out; }
.pop p { margin:0 0 8px; font-size:var(--fs-3); }
.pop .popBtns { display:flex; gap:8px; justify-content:flex-end; }
.pop button { padding:4px 8px; font-size:var(--fs-2); }
@keyframes popIn { from { opacity:0; transform:translateY(-4px); } }

/* the statistics double as filters */
.stats div { cursor:pointer; user-select:none; transition:background .12s; }
.stats div:hover { background:var(--soft); }
.stats div[aria-pressed="true"] { background:var(--brand-soft); box-shadow:inset 0 -2px 0 var(--brand); }

/* a row appears the moment its file is queued, and fills in when it is read */
li { animation:rowIn .18s ease-out; }
@keyframes rowIn { from { opacity:0; transform:translateY(-5px); } }
li.pending { opacity:.72; }
.spin { width:16px; height:16px; border-radius:50%; border:2px solid var(--line);
  border-top-color:var(--brand); animation:spin .7s linear infinite; flex:none; }
@keyframes spin { to { transform:rotate(360deg); } }
.tick { width:16px; height:16px; color:var(--ok); flex:none; }
.state { display:flex; align-items:center; padding-top:4px; }
li .thumbwrap { position:relative; flex:none; }
/* The overlay canvas fills the same 48px slot an <img> thumbnail does, but it
   contains the picture instead of covering it: a code that failed to decode is
   often at an edge, and a cover crop would throw away the thing the box points
   at. No border of its own — the drawn box is the signal, and a second
   rectangle around the tile competes with it. */
li canvas.thumb { width:72px; height:72px; border-radius:9px; display:block;
  background:var(--soft); }

/* The "point at the code" panel. One canvas, opened on demand and torn down on
   close: a hundred rows each holding a full-resolution image is the thing that
   kills the page, and the row thumbnails stay 48px for exactly that reason. */
#linkAsk[hidden] { display:none; }
#linkAsk { position:fixed; inset:0; z-index:70; display:flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,.6); padding:16px; }
#linkBox { background:var(--panel); border-radius:14px; padding:20px;
  width:min(94vw,560px); box-shadow:0 20px 60px rgba(0,0,0,.35); }
#linkBox h3 { margin:0 0 12px; font-size:var(--fs-5); }
#linkBox .lbl { margin:12px 0 4px; font-size:var(--fs-2); color:var(--dim); }
/* The host, as large as the title. It is the one fact that decides the answer,
   so it is the one thing that cannot be skimmed past. */
#linkHost { font-family:var(--mono); font-size:var(--fs-5); font-weight:700;
  word-break:break-all; color:var(--fg); }
#linkFull { font-family:var(--mono); font-size:var(--fs-2); color:var(--dim);
  word-break:break-all; max-height:6em; overflow:auto;
  background:var(--soft); border-radius:8px; padding:8px; }
#linkWarn { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
#linkWarn div { font-size:var(--fs-2); color:var(--bad); background:var(--bad-soft);
  border:1px solid var(--bad); border-radius:8px; padding:8px 10px; }
#linkBtns { display:flex; gap:8px; margin-top:16px; }
/* When something is wrong, the safe answer is the emphasised one. */
#linkAsk.risky #linkGo { background:var(--panel); border-color:var(--line); color:var(--dim); }
#linkAsk.risky #linkNo { background:var(--brand); border-color:var(--brand); color:var(--brand-fg); }

#scan[hidden] { display:none; }
#scan { position:fixed; inset:0; z-index:60; display:flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,.72); padding:16px; }
#scanBox { background:var(--panel); border-radius:14px; padding:16px; width:min(96vw,1100px);
  max-height:96vh; display:flex; flex-direction:column; gap:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.35); }
#scanHead { display:flex; align-items:center; gap:8px; }
#scanHead h3 { margin:0; font-size:var(--fs-5); }
#scanStage { position:relative; flex:1; min-height:0; background:#000;
  border-radius:12px; overflow:hidden; display:flex; justify-content:center; }
/* The video is a source, never a displayed element. It used to sit under the
   overlay canvas, laid out by its own object-fit rules, and the two disagreed
   about where the picture actually was - so every box was drawn dozens of
   pixels off. One element, one geometry, no way for them to drift. */
#scanStage video { display:none; }
#scanCanvas { width:100%; height:min(70vh,70vw); touch-action:none; display:block; }
#camMsg { margin:0; font-size:var(--fs-3); color:var(--dim); min-height:1.2em; }
#scanFound { display:flex; flex-direction:column; gap:4px; max-height:20vh; overflow:auto; }
#scanFound div { font-family:var(--mono); font-size:var(--fs-2); color:var(--ok);
  background:var(--ok-soft); border-radius:8px; padding:4px 8px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* The camera as a target, sized and shaped like the drop zone above it. */
#camZone { display:block; width:100%; margin-top:12px; padding:16px 12px; text-align:center;
  border:2px dashed var(--line); border-radius:10px; background:var(--soft);
  color:var(--fg); cursor:pointer; }
#camZone:hover { border-color:var(--brand); background:var(--brand-soft); }
#camZone svg { width:28px; height:28px; margin:0 auto 8px; color:var(--faint); display:block; }
#camZone:hover svg { color:var(--brand); }
#camZone strong { display:block; font-size:var(--fs-3); }
#camZone small { color:var(--dim); font-size:var(--fs-2); }
/* Clear air before the smaller ways in, so the two targets above read as the
   offer and these as the fallback. */
.sourcesLabel { margin-top:24px; font-size:var(--fs-2); color:var(--dim); }
.trustBadge { margin-bottom:12px; display:flex; align-items:center; justify-content:center;
  gap:8px; font-size:var(--fs-2); font-weight:600; color:var(--ok);
  background:var(--ok-soft); border:1px solid var(--ok); border-radius:999px; padding:6px 12px; }
.trustBadge svg { width:16px; height:16px; flex:none; }

#insp[hidden] { display:none; }
#insp { position:fixed; inset:0; z-index:50; display:flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,.55); padding:16px; }
#inspBox { background:var(--panel); border-radius:14px; padding:16px;
  max-width:min(96vw,760px); width:100%; max-height:94vh; overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.35); }
#inspBox h3 { margin:0 0 4px; font-size:var(--fs-4); }
#inspName { color:var(--dim); font-size:var(--fs-3); word-break:break-all; }
#inspHint, #inspKeys { color:var(--dim); font-size:var(--fs-3); margin:8px 0 0; }
#inspKeys { color:var(--dim); }
#inspStage { position:relative; margin:12px 0; background:#111417;
  border-radius:10px; display:flex; justify-content:center; overflow:hidden; }
#inspCanvas { max-width:100%; touch-action:none; cursor:crosshair;
  border-radius:10px; display:block; }
/* Bottom left, where every annotation tool puts them. */
#inspZoom { position:absolute; left:.5rem; bottom:.5rem; display:flex; gap:4px; }
#inspZoom button { min-width:34px; height:34px; padding:0 8px; border-radius:8px;
  border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.55); color:#fff;
  font:inherit; font-size:var(--fs-4); cursor:pointer; }
#inspZoom button:hover { background:rgba(0,0,0,.75); }
#inspMsg { font-size:var(--fs-3); margin:4px 0 0; min-height:1.2em; }
#inspMsg.ok { color:var(--ok); }
#inspMsg.bad { color:var(--warn); }
#inspBtns { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
li .point { font:inherit; font-size:var(--fs-2); padding:4px 8px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--dim);
  border-radius:999px; white-space:nowrap; }
li .point:hover { border-color:var(--brand); color:var(--brand); }
li .point.lead { background:var(--warn-soft); border-color:var(--warn); color:var(--warn);
  font-weight:600; }
li .point.flagged { background:var(--brand-soft); border-color:var(--brand); color:var(--brand); }
li .shim { width:72px; height:72px; border-radius:9px; background:var(--soft);
  animation:shim 1.1s ease-in-out infinite; }
@keyframes shim { 0%,100% { opacity:.55; } 50% { opacity:1; } }

#drop.landed { animation:landed .45s ease-out; }
@keyframes landed { 0% { transform:scale(1); } 35% { transform:scale(.985); border-color:var(--brand); } 100% { transform:scale(1); } }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="brand" href="./">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/>
      </svg>
      qr-multi-imgs
    </a>
    <!-- The decoder's state belongs next to the name of the thing it is the
         state of, and it is the first question a visitor has: does this work
         yet. It was at the bottom of the left column, below everything you
         would click before knowing the answer. -->
    <div id="engine" data-t="engine.loading"></div>
    <nav>
      <span id="ver"></span>
      <a class="ghlink" href="https://github.com/thousandflowers/qr-multi-imgs"
         data-t-title="nav.source" aria-label="GitHub">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
      <select id="lang" class="lang" aria-label="Language"></select>
    </nav>
  </div>
</header>

<main>
  <div class="hero">
    <h1 data-t="hero.title"></h1>
    <p data-t="hero.sub"></p>
    
  </div>

  <div class="tool">
    <aside class="panel">
      <!-- The two tabs are gone. They split one job - get pictures in - across
           two screens, and made the camera a place you had to go rather than
           one more way to hand over an image. It is a button beside the others
           now, and it opens the viewfinder in place. -->
      <div class="pbody" id="paneFiles">
        <!-- Above everything, because it is a different kind of thing from the
             ways in below it: not an option to pick, a condition that holds for
             all of them. And it is read before the first file is dropped, not
             after. -->
        <div class="trustBadge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/><path d="M9 12l2 2 4-4"/>
          </svg>
          <span data-t="trust.badge"></span>
        </div>
        <div id="drop" class="roomy" aria-describedby="dropAlt">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/>
            <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/>
          </svg>
          <strong data-t="drop.title"></strong>
          <small data-t="drop.sub"></small>
          <div class="formats">PNG JPG WEBP GIF BMP AVIF HEIC ZIP</div>
          <!-- Dropping is a pointer gesture with no keyboard equivalent of its
               own. The equivalent exists - it is the buttons below - and this
               is what says so to anyone who cannot see them sitting there. -->
          <p id="dropAlt" class="sr" data-t="drop.keyboard"></p>
        </div>
        <!-- The camera is a target, like the drop zone above it, not a button
             in a list. It is one of the two ways in that a person arrives
             wanting to use; the file and folder pickers are the ways in they
             fall back to. -->
        <button id="camZone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M3 8a2 2 0 012-2h2l1.5-2h7L17 6h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <circle cx="12" cy="12.5" r="3.4"/>
          </svg>
          <strong data-t="cam.zoneTitle"></strong>
          <small data-t="cam.zoneSub"></small>
        </button>

        <div class="sourcesLabel" data-t="drop.orChoose"></div>

        <div class="actions">
          <div class="span2 hide" id="shootWrap">
            <button id="shoot" class="primary" style="width:100%">
              <svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 012-2h2l1.5-2h7L17 6h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
              <span data-t="drop.shoot"></span>
            </button>
          </div>
          <button id="pickFiles" class="primary">
            <svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M4 15l4.5-4.5 3.5 3.5 3-3L20 15"/><circle cx="9" cy="9" r="1.4"/></svg>
            <span data-t="drop.browse"></span>
          </button>
          <button id="pickFolder">
            <svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg>
            <span></span>
          </button>
          <button id="pasteBtn">
            <svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-2"/></svg>
            <span data-t="drop.paste"></span>
          </button>
        </div>
        <input type="file" id="files" multiple accept="image/*,.zip,.csv,.tsv,.txt">
        <input type="file" id="folder" webkitdirectory directory multiple>
        <input type="file" id="camshot" accept="image/*" capture="environment">

      </div>

    </aside>

    <section class="panel">
      <div class="phead">
        <h2 data-t="res.title"></h2>
      </div>

      <div id="work" class="hide">
        <div class="workRow">
          <!-- Announced, not just drawn. A count that only changes visually
               tells a screen-reader user nothing, and this is the part of the
               page that answers "is it stuck". -->
          <span id="count" role="status" aria-live="polite"></span>
          <span class="grow"></span>
          <button id="pause" class="hide" data-t="work.pause"></button>
          <button id="clear" class="danger" data-t="act.clear"></button>
        </div>
        <div id="nowFile"></div>
        <div id="bar"><i></i></div>
        <div id="clearPop" class="pop hide">
          <p data-t="act.clearAsk"></p>
          <div class="popBtns">
            <button id="clearNo" data-t="act.cancel"></button>
            <button id="clearYes" class="danger" data-t="act.clear"></button>
          </div>
        </div>
      </div>

      <div id="empty" class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/>
        </svg>
        <p id="emptyText"></p>
      </div>

      <div id="out" class="hide">
        <!-- Three numbers. There were seven, two of which filtered the same
             rows as their neighbour, and a sentence underneath repeating two
             of them. What a person wants from a glance is how much there is,
             how much came out, and how much is left to deal with. -->
        <div class="stats">
          <div id="fAll" role="button" aria-pressed="true"><b id="sTotal">0</b><span data-t="stat.images"></span></div>
          <div id="fWith" class="hit" role="button" aria-pressed="false"><b id="sWith">0</b><span data-t="stat.with"></span></div>
          <div id="fUnread" class="warn" role="button" aria-pressed="false"><b id="sUnread">0</b><span data-t="stat.toRead"></span></div>
        </div>

        <!-- Filters on their own line, exports on another. They were mixed
             into one bar, so narrowing the list and taking it away looked like
             the same kind of act. -->
        <div class="bar2">
          <span class="barLabel" data-t="res.filters"></span>
          <input type="search" id="search" data-t-ph="res.search">
          <button id="fUniq" class="chip" role="button" aria-pressed="false"
                  data-t="stat.unique" data-t-title="stat.uniqueHelp"></button>
          <button id="fFlag" class="chip" role="button" aria-pressed="false" data-t="filter.flagged"></button>
          <label class="sr" for="kind" data-t="filter.kind"></label>
          <select id="kind"><option value="" data-t="filter.kindAll"></option></select>
        </div>

        <div class="bar2 exports">
          <span class="barLabel" data-t="res.export"></span>
          <!-- One primary act. The rest are the same size as their labels. -->
          <button id="zip" class="primary"></button>
          <button id="copyAll" class="quiet" data-t="act.copyAll"></button>
          <select id="fmt"><option>csv</option><option>json</option><option>txt</option></select>
          <button id="save" class="quiet" data-t="act.download"></button>
          <span class="grow"></span>
          <select id="qrFmt">
            <option value="png">PNG</option>
            <option value="jpg">JPEG</option>
            <option value="svg">SVG</option>
            <option value="pdf">PDF</option>
          </select>
          <button id="qrSave" class="quiet"></button>
          <span id="qrMsg"></span>
        </div>

        <!-- Renaming is a decision most people never make, and it was three
             controls and a worked example sitting open in front of everyone.
             Closed by default: first see whether they want the files at all. -->
        <details id="renameWrap">
          <summary data-t="rename.toggle"></summary>
          <div class="bar2">
            <label for="pattern" class="barLabel" data-t="rename.pattern"></label>
            <select id="pattern">
              <option value="short" data-t="rename.short"></option>
              <option value="code" data-t="rename.code"></option>
              <option value="nameCode" data-t="rename.nameCode"></option>
              <option value="keep" data-t="rename.keep"></option>
            </select>
            <span id="renameEg"></span>
          </div>
        </details>

        <div id="csvBar" class="bar2 hide">
          <span id="csvMsg"></span>
          <button id="csvClear" class="quiet" data-t="csv.clear"></button>
        </div>

        <p id="noMatch" class="nomatch hide"></p>
        <ul id="list"></ul>
      </div>
    </section>
  </div>

  </main>

<footer>
  <div class="fbar">
    <!-- The privacy line lived here and in the hero, saying the same thing
         twice. The hero says it where a first-time visitor actually reads. -->
    <span class="grow"></span>
    <a href="https://github.com/thousandflowers/qr-multi-imgs">GitHub</a>
    <a href="https://github.com/thousandflowers/qr-multi-imgs/blob/main/LICENSE">MIT</a>
  </div>
</footer>
<!-- Where a scanned link goes, shown before anyone follows it. A QR code is a
     URL nobody can read, so the one way this page could mislead a person is by
     opening something the code did not visibly say. It never opens straight
     from a scan. -->
<div id="linkAsk" hidden role="dialog" aria-modal="true" aria-labelledby="linkTitle">
  <div id="linkBox">
    <h3 id="linkTitle" data-t="link.title"></h3>
    <p class="lbl" data-t="link.goes"></p>
    <div id="linkHost"></div>
    <p class="lbl" data-t="link.full"></p>
    <div id="linkFull"></div>
    <div id="linkWarn"></div>
    <div id="linkBtns">
      <button id="linkGo" class="primary" data-t="link.open"></button>
      <button id="linkNo" data-t="link.cancel"></button>
    </div>
  </div>
</div>

<!-- The live scanner. Nearly the whole page, because the job is looking at a
     moving picture and deciding whether the code is inside the frame - and a
     viewfinder the size of a thumbnail cannot answer that. It draws a box on
     every code it can see: green for the ones it read, amber for the ones it
     found and could not. Freezing keeps the last frame so a box can be drawn
     by hand over a code the machine could not manage. -->
<div id="scan" hidden role="dialog" aria-modal="true" aria-labelledby="scanTitle">
  <div id="scanBox">
    <div id="scanHead">
      <h3 id="scanTitle" data-t="cam.title"></h3>
      <span class="grow"></span>
      <button id="scanFreeze" data-t="cam.freeze"></button>
      <button id="scanClose" data-t="insp.close"></button>
    </div>
    <div id="scanStage">
      <video id="cam" playsinline muted></video>
      <canvas id="scanCanvas"></canvas>
    </div>
    <p id="camMsg" role="status" aria-live="polite"></p>
    <div id="scanFound"></div>
  </div>
</div>

<!-- The area picker. Hidden until a row asks for it, and its canvas is torn
     down on close: one full-resolution image at a time is the whole memory
     budget this page has. -->
<div id="insp" hidden role="dialog" aria-modal="true" aria-labelledby="inspTitle">
  <div id="inspBox">
    <h3 id="inspTitle" data-t="insp.title"></h3>
    <div id="inspName"></div>
    <p id="inspHint" data-t="insp.hint"></p>
    <div id="inspStage">
      <canvas id="inspCanvas" tabindex="0"></canvas>
      <div id="inspZoom">
        <button id="inspZoomOut" data-t-title="insp.zoomOut" aria-label="-">&minus;</button>
        <button id="inspFit" data-t-title="insp.fit" data-t="insp.fitShort"></button>
        <button id="inspZoomIn" data-t-title="insp.zoomIn" aria-label="+">+</button>
      </div>
    </div>
    <p id="inspKeys" data-t="insp.keys"></p>
    <p id="inspMsg" role="status" aria-live="polite"></p>
    <div id="inspBtns">
      <button id="inspRescan" class="primary" data-t="insp.rescan"></button>
      <button id="inspClose" data-t="insp.close"></button>
    </div>
  </div>
</div>

<script src="strings.js"></script>
<script src="i18n.js"></script>
<script src="csvin.js"></script>
<script src="linkcheck.js"></script>
<script src="qrgen.js"></script>
<script src="select.js"></script>
<script src="result.js"></script>
<script src="coords.js"></script>
<script src="order.js"></script>
<script src="payload.js"></script>
<script src="zip.js"></script>
<script src="unzip.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const t = (k, v) => I18N.t(k, v);
const SVGNS = "http://www.w3.org/2000/svg";

/* the in-tab engine */

// Each worker holds its own Go runtime and wasm memory, so the pool trades RAM
// for throughput. Six is where that trade stops paying on a laptop.
const POOL = Math.max(1, Math.min(6, (navigator.hardwareConcurrency || 2) - 2));
let enginesReady = 0, engineFailed = false, engineReason = "", localAppFound = false;

const queue = [], idle = [];
// Every file gets a row the moment it is queued, so the list is the list of
// what was loaded, not only of what has finished.
const rows = [];
const byId = new Map();
// What was dropped, one entry per drop, so the bar can name the folder it is
// working through instead of only counting.
const batches = [];
const seenCount = new Map();
let done = 0, expected = 0, nextId = 0;

// Compile the decoder once and hand the same module to every worker. Letting
// each fetch its own meant six downloads of the same file, which is most of
// what made the page feel slow to wake up.
const workers = [];
for (let i = 0; i < POOL; i++) {
  const w = new Worker("worker.js");
  w.onmessage = (e) => onWorkerMessage(w, e.data);
  w.onerror = () => engineDied("the decoder could not start");
  workers.push(w);
}

(async () => {
  try {
    let module;
    try {
      module = await WebAssembly.compileStreaming(fetch("qr.wasm"));
    } catch {
      // A host serving .wasm with the wrong Content-Type rejects the stream.
      module = await WebAssembly.compile(await (await fetch("qr.wasm")).arrayBuffer());
    }
    for (const w of workers) w.postMessage({ type: "module", module });
  } catch (e) {
    engineDied("decoder failed: " + String((e && e.message) || e));
  }
})();

function engineDied(why) {
  if (!engineFailed) { engineFailed = true; engineReason = why; }
  paintEngineState();
}

function paintEngineState() {
  if (!engineFailed) return;
  if (localAppFound) {
    $("engine").textContent = "";
    return;
  }
  $("engine").textContent = engineReason;
  $("engine").classList.remove("ready");
  $("engine").classList.add("failed");
}

function onWorkerMessage(w, msg) {
  if (msg.type === "ready") {
    enginesReady++;
    idle.push(w);
    $("engine").textContent = t("engine.ready");
    $("engine").classList.add("ready");
    pump();
    return;
  }
  if (msg.type === "fatal") { engineDied("decoder failed: " + msg.error); return; }
  // An assisted decode of one region the user pointed at. Routed here rather
  // than into finish(), which would overwrite the row's own scan with the
  // crop's — the crop is an addition to what the row knows, not a replacement.
  if (msg.type === "cropResult") {
    const waiting = cropWaiting.get(msg.id);
    if (waiting) { cropWaiting.delete(msg.id); waiting(msg); }
    else adoptCropResult(byId.get(msg.id), msg);
    idle.push(w); pump(); return;
  }
  if (msg.type === "encodeResult") {
    const done = encodeWaiting.get(msg.id);
    encodeWaiting.delete(msg.id);
    if (done) done(msg.matrices || []);
    idle.push(w); pump(); return;
  }
  if (msg.type === "frameResult") { adoptFrameResult(msg); idle.push(w); pump(); return; }
  finish(msg);
  idle.push(w);
  pump();
}

// paused holds the queue without touching what is already in flight: a worker
// mid-image finishes it, and nothing new goes out until the button is pressed
// again. Cancelling a decode that has already started is not possible from
// here, and pretending otherwise would leave a row spinning forever.
let paused = false;
const inFlight = new Map();   // job id -> { name, at }

function pump() {
  if (paused) return;
  while (idle.length && queue.length) {
    const job = queue.shift();
    if (job.id !== undefined && job.name) inFlight.set(job.id, { name: job.name, at: Date.now() });
    idle.pop().postMessage(job);
  }
  paintProgress();
}

function togglePause() {
  paused = !paused;
  $("pause").textContent = t(paused ? "work.resume" : "work.pause");
  paintProgress();
  if (!paused) pump();
}

// A scan long enough to worry about gets named. Two seconds is roughly where a
// person stops assuming it is working and starts assuming it is stuck.
const SLOW_MS = 2000;
setInterval(() => { if (inFlight.size) paintProgress(); }, 700);

function finish(msg) {
  inFlight.delete(msg.id);
  const r = byId.get(msg.id);
  if (!r) return; // its run was cleared
  r.pending = false;
  r.error = msg.error || "";
  // The worker cannot reach the string table, so it names the sentence instead
  // of writing it. See err.unopenable.
  r.errorKey = msg.errorKey || "";
  // Payloads, the reason there are none, and the geometry of any code that was
  // located and could not be read — plus the pixel frame that geometry is
  // measured in. Result.adopt rather than three assignments because the
  // geometry was silently dropped on this hop once already; see result.js.
  //
  // Nothing draws r.detections yet. It is here so that the thing that will
  // draw it has something to draw.
  Result.adopt(r, msg);
  r.thumbURL = msg.thumb ? URL.createObjectURL(msg.thumb) : "";
  r.at = new Date();
  for (const c of r.codes) seenCount.set(c, (seenCount.get(c) || 0) + 1);
  done++;
  if (r.batch) r.batch.done++;
  renderRow(r);
  paintProgress();
  paintStats();
  // A repeated payload changes what its earlier siblings should say.
  if (r.codes.some((c) => (seenCount.get(c) || 0) > 1)) {
    for (const other of rows) {
      if (other !== r && !other.pending && other.codes.some((c) => r.codes.includes(c))) renderRow(other);
    }
  }
  applyFilters();
}

/* getting the files */

// A CSV is not an image and is still worth taking: it is a list of payloads to
// turn INTO codes. It is separated out at intake rather than pushed at the
// decoder, which would only report that a spreadsheet contains no QR code.
const worthTrying = (f) => !f.type || f.type.startsWith("image/") || Unzip.looksLikeZip(f) || CSVIn.looksLikeCSV(f);

async function readDirectory(entry, prefix, out) {
  const reader = entry.createReader();
  // readEntries returns one batch at a time and ends with an empty one; a
  // single call silently truncates a folder past about a hundred files.
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) return;
    for (const e of batch) await walkEntry(e, prefix, out);
  }
}

async function walkEntry(entry, prefix, out) {
  const here = prefix ? prefix + "/" + entry.name : entry.name;
  if (entry.isDirectory) return readDirectory(entry, here, out);
  const file = await new Promise((res, rej) => entry.file(res, rej));
  if (worthTrying(file)) out.push({ file, path: here });
}

async function fromDataTransfer(dt) {
  const out = [];
  const entries = [...dt.items].map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (entries.length) {
    for (const e of entries) await walkEntry(e, "", out);
    return out;
  }
  for (const f of dt.files) if (worthTrying(f)) out.push({ file: f, path: f.name });
  return out;
}

// An archive is a folder that happens to be one file, so it is unpacked here
// rather than refused. Its inner paths are kept, since where a photo sat is
// half of what a batch scan is for.
async function expandArchives(items) {
  const out = [];
  for (const it of items) {
    if (!Unzip.looksLikeZip(it.file)) { out.push(it); continue; }
    try {
      const { files } = await Unzip.entries(it.file);
      for (const f of files) {
        // Archives written from inside a folder carry a "./" prefix, and macOS
        // adds a __MACOSX shadow tree of resource forks that is not pictures.
        const inner = f.name.replace(/^\.\//, "");
        if (inner.startsWith("__MACOSX/")) continue;
        const name = inner.split("/").pop();
        if (!name || name.startsWith(".")) continue;
        out.push({
          file: new File([f.blob], name),
          path: it.path.replace(/\.zip$/i, "") + "/" + inner,
        });
      }
    } catch {
      // Not readable as an archive: let it through so the row reports why.
      out.push(it);
    }
  }
  return out;
}

// The name of what was just dropped: the folder if they all came from one,
// the file itself if there is only one, otherwise a count.
function labelFor(items) {
  const tops = new Set(items.map((i) => (i.path || i.file.name).split("/")[0]));
  if (tops.size === 1) {
    const only = [...tops][0];
    return items.length === 1 ? items[0].file.name : only;
  }
  return t("work.files", { n: items.length });
}

async function accept(items) {
  if (!items.length) { $("emptyText").textContent = t("res.nothing"); return; }
  bounce();
  // A list of payloads goes one way and pictures go the other. Sending a CSV
  // to the decoder would only report that a spreadsheet holds no QR code.
  const lists = items.filter((it) => CSVIn.looksLikeCSV(it.file));
  const pictures = items.filter((it) => !CSVIn.looksLikeCSV(it.file));
  for (const it of lists) await loadCodeList(it.file);
  if (!pictures.length) return;
  const expanded = await expandArchives(pictures);
  if (!expanded.length) { $("emptyText").textContent = t("res.nothing"); return; }
  enqueue(expanded, labelFor(expanded));
}

// Payloads loaded from a list, kept beside the ones found in pictures. They
// share the download because writing codes to files is one job whichever end
// they came from.
let csvItems = [];

async function loadCodeList(file) {
  const parsed = CSVIn.read(await file.text());
  if (!parsed.items.length) { $("emptyText").textContent = t("res.nothing"); return; }
  csvItems = csvItems.concat(parsed.items);
  const notes = [];
  if (!parsed.usedHeader) notes.push(t("csv.noHeader"));
  if (parsed.skipped) notes.push(t("csv.skipped", { n: parsed.skipped }));
  $("csvMsg").textContent =
    t("csv.loaded", { n: csvItems.length, file: file.name, col: parsed.valueColumn }) +
    (notes.length ? " · " + notes.join(" · ") : "");
  $("csvBar").classList.remove("hide");
  $("out").classList.remove("hide");
  $("empty").classList.add("hide");
  applyFilters();
}

function clearCodeList() {
  csvItems = [];
  $("csvBar").classList.add("hide");
  $("csvMsg").textContent = "";
  applyFilters();
}

function enqueue(items, label) {
  if (!items.length) { $("emptyText").textContent = t("res.nothing"); return; }
  const batch = { label: label || "", total: items.length, done: 0 };
  batches.push(batch);
  $("empty").classList.add("hide");
  $("out").classList.remove("hide");
  $("work").classList.remove("hide");
  $("bar").classList.remove("done");
  expected += items.length;

  for (const it of items) {
    const id = nextId++;
    const r = { id, name: it.file.name, path: it.path, file: it.file, batch,
                codes: [], error: "", reason: "", detections: [], frame: null,
                thumbURL: "", pending: true,
                seq: rows.length + 1 };
    rows.push(r);
    byId.set(id, r);
    renderRow(r);                      // the row exists before its answer does
    queue.push({ id, name: r.name, path: r.path, blob: it.file });
  }
  paintProgress();
  paintStats();
  applyFilters();
  pump();
}

function bounce() {
  const d = $("drop");
  d.classList.remove("landed");
  void d.offsetWidth;                  // restart the animation on a second drop
  d.classList.add("landed");
}

/* the camera */

let stream = null;

// The live scanner.
//
// A viewfinder that stops to think is a viewfinder you cannot aim, so nothing
// here waits: one frame is in flight at a time, the next is grabbed when the
// last comes back, and the drawing keeps happening either way. If decoding
// takes 200ms the boxes lag 200ms behind the picture, which is what a person
// expects; blocking the page would not be.
const live = {
  seq: 0,
  inFlight: false,
  dets: [],        // last detections, in the decoded frame's pixels
  frame: null,     // the space those are measured in
  frozen: null,    // an ImageBitmap of the held frame, when frozen
  selNat: null,    // a hand-drawn box on the held frame, in frame pixels
  drag: null,
  raf: 0,
  found: new Map(),
};

// The long side the live decode runs at. Smaller than the capture on purpose:
// a code big enough to aim at is big enough to read at 720, and the frame rate
// is what makes aiming possible.
const LIVE_CAP = 720;

async function openScanner() {
  $("scan").hidden = false;
  $("camMsg").textContent = "";
  $("scanFound").replaceChildren();
  live.found.clear();
  live.dets = [];
  live.frozen = null;
  live.selNat = null;
  setFreezeLabel(false);
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false,
    });
  } catch (e) {
    $("camMsg").textContent = e && e.name === "NotAllowedError" ? t("cam.denied") : t("cam.none");
    return;
  }
  const v = $("cam");
  v.srcObject = stream;
  await v.play();
  $("camMsg").textContent = t("cam.looking");
  live.raf = requestAnimationFrame(liveTick);
}

function closeScanner() {
  $("scan").hidden = true;
  cancelAnimationFrame(live.raf);
  live.raf = 0;
  if (live.frozen) { live.frozen.close(); live.frozen = null; }
  if (stream) for (const tr of stream.getTracks()) tr.stop();
  stream = null;
  $("cam").srcObject = null;
}

function setFreezeLabel(frozen) {
  $("scanFreeze").textContent = t(frozen ? "cam.resume" : "cam.freeze");
}

// stageRect is where the picture actually sits inside the overlay canvas. The
// video is object-fit contained, so the canvas is bigger than the image on one
// axis and a box drawn against the canvas would be offset by the letterbox.
function stageRect() {
  const c = $("scanCanvas"), v = $("cam");
  const w = live.frozen ? live.frozen.width : v.videoWidth;
  const h = live.frozen ? live.frozen.height : v.videoHeight;
  if (!w || !h) return null;
  return Coords.fitContain(w, h, c.width, c.height);
}

function liveTick() {
  live.raf = requestAnimationFrame(liveTick);
  const v = $("cam"), c = $("scanCanvas");
  if (!live.frozen && (!v.videoWidth || v.readyState < 2)) return;

  const dpr = window.devicePixelRatio || 1;
  const box = c.getBoundingClientRect();
  if (c.width !== Math.round(box.width * dpr) || c.height !== Math.round(box.height * dpr)) {
    c.width = Math.round(box.width * dpr);
    c.height = Math.round(box.height * dpr);
  }
  if (!live.frozen) sendFrame(v);
  paintScanner(v);
}

// sendFrame hands the worker raw pixels and transfers the buffer, so nothing
// is copied on the way out.
function sendFrame(v) {
  if (live.inFlight) return;
  const scale = Math.min(1, LIVE_CAP / Math.max(v.videoWidth, v.videoHeight));
  const w = Math.max(1, Math.round(v.videoWidth * scale));
  const h = Math.max(1, Math.round(v.videoHeight * scale));
  const off = liveCanvas(w, h);
  const ctx = off.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(v, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h);
  const worker = idle.pop();
  if (!worker) return;
  live.inFlight = true;
  live.worker = worker;
  worker.postMessage({ type: "frame", id: ++live.seq, w, h,
    natW: v.videoWidth, natH: v.videoHeight, buf: data.data.buffer }, [data.data.buffer]);
}

let _liveCanvas = null;
function liveCanvas(w, h) {
  if (!_liveCanvas) _liveCanvas = document.createElement("canvas");
  if (_liveCanvas.width !== w) _liveCanvas.width = w;
  if (_liveCanvas.height !== h) _liveCanvas.height = h;
  return _liveCanvas;
}

function adoptFrameResult(msg) {
  live.inFlight = false;
  live.dets = msg.detections || [];
  live.frame = msg.frame || null;
  for (const c of msg.codes || []) {
    if (live.found.has(c)) continue;
    live.found.set(c, true);
    const row = document.createElement("div");
    row.textContent = c;
    $("scanFound").prepend(row);
    // A code seen live is a result like any other, so it joins the list.
    enqueueDecodedFromCamera(c);
  }
  if (msg.codes && msg.codes.length) $("camMsg").textContent = t("cam.read", { n: live.found.size });
}

function paintScanner(v) {
  const c = $("scanCanvas");
  const ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, c.width, c.height);

  const rect = stageRect();
  if (!rect) return;
  // The picture itself, drawn here rather than shown underneath.
  const src = live.frozen || v || $("cam");
  try { ctx.drawImage(src, rect.x, rect.y, rect.w, rect.h); } catch { /* first frames */ }

  for (const d of live.dets) {
    const b = live.frame ? Coords.detectionToDisplay(d, live.frame, rect) : null;
    if (!b) continue;
    // Green when the payload came out, amber when the code was found and could
    // not be read. The colours are the classification, drawn.
    const read = !!d.text;
    ctx.lineWidth = Math.max(2, 3 * dpr);
    ctx.strokeStyle = read ? "#19c46a" : "#f0a500";
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    if (read) {
      ctx.fillStyle = "rgba(25,196,106,.16)";
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  }

  if (live.frozen && live.selNat) {
    const s = Coords.naturalToDisplay(live.selNat, { w: live.frozen.width, h: live.frozen.height,
      naturalW: live.frozen.width, naturalH: live.frozen.height }, rect);
    if (s) {
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.beginPath();
      ctx.rect(0, 0, c.width, c.height);
      ctx.rect(s.x + s.w, s.y, -s.w, s.h);
      ctx.fill();
      ctx.lineWidth = Math.max(2, 2 * dpr);
      ctx.strokeStyle = "#f0a500";
      ctx.strokeRect(s.x, s.y, s.w, s.h);
      const hs = 7 * dpr;
      ctx.fillStyle = "#f0a500";
      for (const h of Select.handlePoints(s)) ctx.fillRect(h.x - hs, h.y - hs, hs * 2, hs * 2);
    }
  }
}

async function toggleFreeze() {
  if (live.frozen) {
    live.frozen.close();
    live.frozen = null;
    live.selNat = null;
    setFreezeLabel(false);
    $("camMsg").textContent = t("cam.looking");
    return;
  }
  const v = $("cam");
  if (!v.videoWidth) return;
  live.frozen = await createImageBitmap(v);
  live.dets = [];
  setFreezeLabel(true);
  $("camMsg").textContent = t("cam.frozen");
}


// One frame in flight at a time: queuing them builds a backlog of moments the
// user has already moved past.
// A code seen through the camera becomes a row like any other, so it exports,
// copies and renames the same way. There is no file behind it, which is what
// keeps the area picker off it.
function enqueueDecodedFromCamera(code) {
  seenCount.set(code, (seenCount.get(code) || 0) + 1);
  const r = Result.adopt({ id: nextId++, name: t("tab.camera"), path: "", file: null,
    error: "", thumbURL: "", pending: false, seq: rows.length + 1, at: new Date() },
    { codes: [code], reason: "DECODED", detections: [], frame: null });
  rows.push(r);
  byId.set(r.id, r);
  $("empty").classList.add("hide");
  $("out").classList.remove("hide");
  renderRow(r);
  paintStats();
  applyFilters();
}

/* naming */

function newNameFor(r) {
  const pattern = $("pattern").value;
  if (pattern === "keep" || !r.codes.length) return r.name;
  const dot = r.name.lastIndexOf(".");
  const ext = dot > 0 ? r.name.slice(dot) : "";
  const stem = dot > 0 ? r.name.slice(0, dot) : r.name;
  const code = r.codes[0];
  const value = pattern === "code" ? code : Payload.shortValue(code);
  const base = pattern === "nameCode"
    ? Zip.safeName(stem, 40) + "-" + Zip.safeName(Payload.shortValue(code), 40)
    : Zip.safeName(value, 80);
  return base + ext;
}

// Recreating the decoded codes as files, in the browser.
//
// One file per DISTINCT payload, not one per row: two photographs of the same
// poster are one code, and handing back two identical PNGs named after two
// different photos would be a filing job for the user rather than a result.
//
// A single code downloads as a single file. Several become a zip, except for
// PDF, which is already a container - one document, one page per code, which
// is what a person printing a sheet of them wants.
// The engine lives in the workers; the page has no wasm instance of its own,
// so encoding is a round trip like every other decode. Found the hard way: the
// first version called qrEncode() straight from the page and got
// "qrEncode is not defined".
// A crop can belong to a row (the area picker) or to nobody (a box drawn on a
// frozen camera frame). The map holds the second kind; the first is found by
// row id.
const cropWaiting = new Map();
const encodeWaiting = new Map();
let encodeSeq = 0;
function encodeAll(texts) {
  return new Promise((resolve) => {
    const id = "enc" + ++encodeSeq;
    encodeWaiting.set(id, resolve);
    queue.push({ type: "encode", id, texts });
    pump();
  });
}

function recreatable() {
  const seen = new Map();
  for (const r of rows) {
    if (r.pending || r.error) continue;
    for (const c of r.codes) if (!seen.has(c)) seen.set(c, r);
  }
  // Payloads from a list, after the ones found in pictures: a code that is
  // both scanned and listed keeps the row it was scanned from, so its file is
  // named after the photograph it came out of.
  for (const it of csvItems) if (!seen.has(it.value)) seen.set(it.value, { name: it.name || it.value });
  return [...seen.entries()];
}

// askBeforeOpening never opens anything itself until the person says so, and
// it says where they are going in the plainest terms available: the host,
// large, and the whole address underneath.
function askBeforeOpening(url) {
  const info = LinkCheck.inspect(url);
  if (!info.openable) return;   // not a link, or a scheme a page must not follow
  $("linkHost").textContent = info.display;
  $("linkFull").textContent = info.input;
  const warn = $("linkWarn");
  warn.replaceChildren();
  for (const w of info.warnings) {
    const d = document.createElement("div");
    d.textContent = t("link.warn." + w);
    warn.appendChild(d);
  }
  // With a warning on screen, "don't open" becomes the emphasised button. The
  // default answer should be the safe one exactly when it matters.
  $("linkAsk").classList.toggle("risky", info.warnings.length > 0);
  $("linkAsk").hidden = false;
  $("linkGo").onclick = () => {
    $("linkAsk").hidden = true;
    window.open(info.input, "_blank", "noopener,noreferrer");
  };
  ($("linkAsk").classList.contains("risky") ? $("linkNo") : $("linkGo")).focus();
}

// paintRenameExample answers "what will this actually be called" with a real
// file from the list rather than a description of a rule.
function paintRenameExample() {
  const r = rows.find((x) => x.file && !x.pending && x.codes.length);
  $("renameEg").textContent = r ? t("rename.example", { name: newNameFor(r) }) : "";
}

function paintQrCount() {
  const n = recreatable().length;
  $("qrSave").textContent = t("qrgen.download", { n });
  $("qrSave").disabled = n === 0;
}

async function downloadRecreated() {
  const pairs = recreatable();
  if (!pairs.length) { $("qrMsg").textContent = t("qrgen.none"); return; }
  const fmt = $("qrFmt").value;
  $("qrSave").disabled = true;
  $("qrMsg").textContent = t("qrgen.working");
  // Yield once so the message paints before the encoding blocks the thread.
  await new Promise((r) => setTimeout(r, 0));

  try {
    const matrices = await encodeAll(pairs.map(([code]) => code));
    const named = [];
    pairs.forEach(([code, row], i) => {
      if (!matrices[i]) return;
      named.push({ stem: Zip.safeName(Payload.shortValue(code) || row.name, 60), matrix: matrices[i] });
    });
    if (!named.length) { $("qrMsg").textContent = t("qrgen.none"); return; }

    if (fmt === "pdf") {
      saveBlob(new Blob([QRGen.toPDF(named.map((n) => n.matrix))], { type: "application/pdf" }), "qr-codes.pdf");
    } else if (named.length === 1) {
      saveBlob(await oneFile(named[0], fmt), named[0].stem + "." + fmt);
    } else {
      const taken = new Set();
      const entries = [];
      for (const n of named) {
        const blob = await oneFile(n, fmt);
        entries.push({ name: Zip.uniqueName(taken, n.stem + "." + fmt), data: new Uint8Array(await blob.arrayBuffer()) });
      }
      saveBlob(Zip.build(entries), "qr-codes.zip");
    }
    $("qrMsg").textContent = "";
  } catch (e) {
    $("qrMsg").textContent = String((e && e.message) || e);
  } finally {
    paintQrCount();
  }
}

function oneFile(n, fmt) {
  if (fmt === "svg") {
    return Promise.resolve(new Blob([QRGen.toSVG(n.matrix)], { type: "image/svg+xml" }));
  }
  // A DOM canvas rather than an OffscreenCanvas: this one has toBlob with a
  // callback, which is what the rest of the page already uses.
  const canvas = QRGen.toCanvas(n.matrix, 1024, function () { return document.createElement("canvas"); });
  return new Promise((res) => canvas.toBlob(res, fmt === "jpg" ? "image/jpeg" : "image/png", 0.92));
}

async function downloadZip() {
  const list = visibleRows().filter((r) => r.file && !r.pending);
  if (!list.length) { $("emptyText").textContent = t("rename.none"); return; }
  $("zip").disabled = true;
  try {
    const taken = new Set();
    const entries = [];
    for (const r of list) {
      entries.push({ name: Zip.uniqueName(taken, newNameFor(r)),
                     data: new Uint8Array(await r.file.arrayBuffer()) });
    }
    // The mapping from image to code is the valuable part of a batch scan, so
    // it travels inside the archive rather than as a separate download nobody
    // keeps next to it.
    entries.push({ name: "codici.csv", data: new TextEncoder().encode(serialise("csv")) });
    saveBlob(Zip.build(entries), "qr-immagini.zip");
  } finally {
    $("zip").disabled = false;
  }
}

/* painting */

function paintProgress() {
  const pct = expected ? (100 * done) / expected : 0;
  $("bar").firstElementChild.style.width = pct + "%";
  const finished = expected > 0 && done === expected;
  $("bar").classList.toggle("done", finished);
  $("pause").classList.toggle("hide", finished || !expected);

  // In words, not just a bar. "34 of 210" is the answer to the question a bar
  // only gestures at, and it is the text a screen reader announces.
  $("count").textContent = paused
    ? t("work.paused", { left: Math.max(0, expected - done) })
    : finished
      ? t("work.done", { n: done })
      : t("work.progress", { done, total: expected });

  // What is being read right now, and whether it has been on it too long.
  const now = Date.now();
  let slowest = null;
  for (const v of inFlight.values()) if (!slowest || v.at < slowest.at) slowest = v;
  const el = $("nowFile");
  if (!slowest || finished) {
    el.textContent = "";
    el.classList.remove("slow");
  } else if (now - slowest.at > SLOW_MS) {
    el.textContent = t("work.slow", { name: slowest.name });
    el.classList.add("slow");
  } else {
    el.textContent = t("work.now", { name: slowest.name });
    el.classList.remove("slow");
  }
}

// The web's row order and the two questions behind it live in order.js, next
// to the test that pins them. The terminal orders the same data differently on
// purpose — see resultRank in scanner/scanner.go.
const { rowRank, isUnread, settledEmpty } = Order;

function paintStats() {
  let withQR = 0, codes = 0, errs = 0, unread = 0, settled = 0;
  const uniq = new Set();
  for (const r of rows) {
    if (r.pending) continue;
    settled++;
    if (r.error) errs++;
    else if (r.codes.length) { withQR++; codes += r.codes.length; for (const c of r.codes) uniq.add(c); }
    else if (isUnread(r)) unread++;
  }
  $("sTotal").textContent = rows.length;
  $("sWith").textContent = withQR;
  $("sUnread").textContent = unread;

}

let activeTile = "fAll";
// fCodes used to sit here mapping to "with" - the same rows as fWith, beside
// it, with a different number on it. One filter, one control.
// Three tiles now. "without" and "error" lost their tiles - a bucket nobody
// acts on and a tile that read 0 forever - but the rows are still reachable:
// everything is in "all", and an unopenable file says so on its own row.
const FILTERS = { fAll: "all", fWith: "with", fUniq: "unique", fUnread: "unread" };
const filterOf = () => FILTERS[activeTile] || "all";

// The kind filter is a second axis, not another tile: a row can be "with a
// code" and "a link" at once, and folding them into one control would make
// them exclusive when they are not.
let kindFilter = "";

// A row the person wants to come back to. The scanner's own buckets say what
// the machine thinks; this is the one mark it does not get to set or clear.
let flagOnly = false;
function toggleFlag(r) {
  r.flagged = !r.flagged;
  renderRow(r);
  applyFilters();
}

function kindsPresent() {
  const seen = new Set();
  for (const r of rows) for (const c of r.codes) seen.add(Payload.describe(c).kind);
  return [...seen];
}

// Only the kinds actually on screen. A menu listing every kind the recogniser
// knows would offer a dozen filters that match nothing.
function paintKindFilter() {
  const present = kindsPresent().sort();
  const sel = $("kind");
  const want = present.join(",");
  if (sel.dataset.built === want) return;
  sel.dataset.built = want;
  sel.replaceChildren();
  const all = document.createElement("option");
  all.value = "";
  all.textContent = t("filter.kindAll");
  sel.appendChild(all);
  for (const k of present) {
    const o = document.createElement("option");
    o.value = k;
    // The recogniser already names every kind in six languages, for the
    // labels it prints inside a row. Same names here.
    o.textContent = t("kind." + k, {}) === "kind." + k ? k : t("kind." + k);
    sel.appendChild(o);
  }
  sel.value = present.includes(kindFilter) ? kindFilter : "";
  if (sel.value !== kindFilter) kindFilter = sel.value;
  sel.classList.toggle("hide", present.length < 2);
}

function matchesKind(r) {
  if (!kindFilter) return true;
  return r.codes.some((c) => Payload.describe(c).kind === kindFilter);
}

function matchesFilter(r, firstOfPayload) {
  switch (filterOf()) {
    case "with": return !r.error && r.codes.length > 0;
    case "unread": return settledEmpty(r) && isUnread(r);
    case "without": return settledEmpty(r) && !isUnread(r);
    case "error": return !!r.error;
    case "unique": return !r.error && r.codes.length > 0 && firstOfPayload.has(r.id);
    default: return true;
  }
}

// Search runs over the decoded content and the file name together, because a
// person looking for a ticket id and one looking for a photo are the same
// person ten seconds apart.
function matchesSearch(r) {
  const q = $("search").value.trim().toLowerCase();
  if (!q) return true;
  if (r.name.toLowerCase().includes(q) || (r.path || "").toLowerCase().includes(q)) return true;
  return r.codes.some((c) => c.toLowerCase().includes(q));
}

// For the "unique" view, the row that keeps a payload is the first one that
// found it, so the answer does not move around as later copies arrive.
function firstOwners() {
  const seen = new Set(), keep = new Set();
  for (const r of rows) {
    if (r.pending || r.error || !r.codes.length) continue;
    if (r.codes.some((c) => !seen.has(c))) { keep.add(r.id); for (const c of r.codes) seen.add(c); }
  }
  return keep;
}

function visibleRows() {
  const firsts = firstOwners();
  return rows.filter((r) => matchesFilter(r, firsts) && matchesSearch(r));
}

function applyFilters() {
  const firsts = firstOwners();
  let shown = 0;
  for (const r of rows) {
    const ok = matchesFilter(r, firsts) && matchesKind(r) && matchesSearch(r) && (!flagOnly || r.flagged);
    if (r.el) r.el.classList.toggle("hide", !ok);
    if (ok) shown++;
  }
  for (const id in FILTERS) $(id).setAttribute("aria-pressed", String(id === activeTile));
  $("zip").textContent = t("rename.zip", { n: visibleRows().filter((r) => r.file && !r.pending).length });
  // Once anything has been loaded the big empty state stays out of the way;
  // an empty filter says so from inside the list instead.
  if (rows.length) $("empty").classList.add("hide");
  $("drop").classList.toggle("tight", rows.length > 0);
  // Picks accumulate: the input is cleared after every choice, so choosing a
  // second folder adds to the list rather than replacing it. The browser's
  // directory picker only opens one folder at a time - that is a platform
  // limit, not ours - so the button says what to do about it. Dropping several
  // folders at once has always worked and still does.
  // The label lives in the span, not on the button: setting textContent on the
  // button would wipe the icon sitting beside it.
  $("pickFolder").querySelector("span").textContent = t(rows.length ? "drop.folderMore" : "drop.folder");
  paintQrCount();
  paintKindFilter();
  paintRenameExample();
  $("fFlag").setAttribute("aria-pressed", String(flagOnly));
  $("noMatch").textContent = t("res.noMatch");
  $("noMatch").classList.toggle("hide", shown > 0 || !rows.length);
}

const ICONS = {

  wifi: "M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01",
  contact: "M4 20v-1a5 5 0 015-5h6a5 5 0 015 5v1M12 3a4 4 0 100 8 4 4 0 000-8z",
  payment: "M3 7h18v12H3zM3 11h18",
  email: "M3 6h18v12H3zM3 7l9 6 9-6",
  phone: "M6 3h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a2 2 0 01-2 2A17 17 0 014 5a2 2 0 012-2z",
  sms: "M4 5h16v11H8l-4 4z",
  location: "M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11zM12 10h.01",
