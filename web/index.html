};

function svgPath(d, cls) {
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  if (cls) svg.setAttribute("class", cls);
  const p = document.createElementNS(SVGNS, "path");
  p.setAttribute("d", d);
  svg.appendChild(p);
  return svg;
}

function smallButton(label, onClick) {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

function copyButton(text) {
  return smallButton(t("act.copy"), async (e) => {
    await navigator.clipboard.writeText(text);
    const b = e.currentTarget;
    b.textContent = t("act.copied");
    setTimeout(() => (b.textContent = t("act.copy")), 1200);
  });
}

function saveContactButton(raw) {
  return smallButton(t("act.saveContact"), () => {
    const body = /^BEGIN:VCARD/i.test(raw) ? raw : mecardToVcard(raw);
    saveBlob(new Blob([body], { type: "text/vcard" }), "contatto.vcf");
  });
}

function mecardToVcard(raw) {
  const d = Payload.describe(raw);
  const get = (k) => (d.fields.find((f) => f.k === k) || {}).v || "";
  return ["BEGIN:VCARD", "VERSION:3.0", "FN:" + get("name"),
    get("phone") ? "TEL:" + get("phone") : "", get("email") ? "EMAIL:" + get("email") : "",
    "END:VCARD"].filter(Boolean).join("\n");
}

function fieldRow(f) {
  const row = document.createElement("div");
  row.className = "field" + (f.secret ? " secret" : "");
  const k = document.createElement("span");
  k.className = "k";
  k.textContent = t("f." + f.k);
  row.appendChild(k);

  // A two-factor seed, or a Wi-Fi password, stays covered until someone asks
  // for it: a scan is often done with other people looking at the screen.
  if (f.secret) {
    const v = document.createElement("span");
    v.className = "v";
    let shown = false;
    const paint = () => { v.textContent = shown ? f.v : "*".repeat(Math.min(f.v.length, 24)); };
    paint();
    row.appendChild(v);
    row.appendChild(smallButton(t("act.reveal"), (e) => {
      shown = !shown;
      paint();
      e.currentTarget.textContent = shown ? t("act.hide") : t("act.reveal");
    }));
    row.appendChild(copyButton(f.v));
    return row;
  }

  if (f.full && /^https?:\/\//i.test(f.v)) {
    // A button, not an anchor. An anchor navigates on click and there is no
    // moment in between to show where it goes - which is the moment this
    // whole flow exists for.
    const a = document.createElement("button");
    a.className = "v linkish";
    a.type = "button";
    a.textContent = f.v;
    a.onclick = () => askBeforeOpening(f.v);
    row.appendChild(a);
  } else {
    const v = document.createElement("span");
    v.className = "v";
    v.textContent = f.v;
    row.appendChild(v);
  }
  row.appendChild(copyButton(f.v));
  return row;
}

function hitBox(raw) {
  const d = Payload.describe(raw);
  const box = document.createElement("div");
  box.className = "hitbox";

  const top = document.createElement("div");
  top.className = "hitTop";
  const kind = document.createElement("span");
  kind.className = "kind";
  kind.appendChild(svgPath(ICONS[d.kind] || ICONS.text));
  const label = document.createElement("span");
  label.textContent = t("kind." + d.kind);
  kind.appendChild(label);
  top.appendChild(kind);

  const n = seenCount.get(raw) || 0;
  if (n > 1) {
    const dupe = document.createElement("span");
    dupe.className = "dupe";
    dupe.textContent = t("dupe.badge", { n });
    top.appendChild(dupe);
  }

  const grow = document.createElement("span");
  grow.className = "grow";
  top.appendChild(grow);

  if (d.href) top.appendChild(smallButton(t("act.open"), () => askBeforeOpening(d.href)));
  if (d.kind === "contact") top.appendChild(saveContactButton(raw));
  top.appendChild(copyButton(raw));
  box.appendChild(top);

  const fields = document.createElement("div");
  fields.className = "fields";
  for (const f of d.fields) fields.appendChild(fieldRow(f));
  box.appendChild(fields);
  return box;
}

// showsBox decides which rows get geometry drawn on them, and the answer is
// one bucket: an image holding a code that was located and could not be read.
//
// A decoded row does not need a box — it has the payload, which is the answer
// the box was only ever a route to. A NO_QR_FOUND row has no geometry at all,
// because nothing was found to have geometry. And a row whose detections came
// back empty or malformed draws nothing rather than a fallback shape: an
// invented rectangle would tell the user the tool saw a code where it did not,
// which is the failure this whole line of work exists to stop, pointed the
// other way.
function showsBox(r) {
  return isUnread(r) && Array.isArray(r.detections) && r.detections.length > 0 && !!r.frame;
}

// paintBoxes draws the thumbnail and strokes each detection over it.
//
// The thumbnail is derived from the same ImageBitmap the decode ran on, which
// is what makes this safe without a rotation term: whatever the browser decided
// about EXIF orientation, both the pixels the decoder saw and the pixels drawn
// here inherited that same decision. Mixing sources — decoding from a bitmap
// and drawing from an <img> of the original file — is the bug this avoids, and
// it would be invisible on a desktop image and wrong on every phone photo.
//
// Sizes are recomputed on every call rather than cached: the backing store
// depends on devicePixelRatio, which changes when a window moves between
// displays, and a cached size would leave the box drawn for the old screen.
function paintBoxes(r) {
  const canvas = r.canvas;
  if (!canvas || !r.thumbURL) return;
  const img = new Image();
  img.onload = () => {
    // The row may have been re-rendered or cleared while the thumbnail loaded.
    if (r.canvas !== canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const side = canvas.clientWidth || 72;
    canvas.width = Math.round(side * dpr);
    canvas.height = Math.round(side * dpr);

    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const fit = Coords.fitContain(img.naturalWidth, img.naturalHeight, canvas.width, canvas.height);
    if (!fit) return;
    ctx.drawImage(img, fit.x, fit.y, fit.w, fit.h);

    // Two strokes, dark under bright, so the box reads on a white receipt and
    // on a night photo without knowing which it is.
    for (const det of r.detections) {
      const b = Coords.detectionToDisplay(det, r.frame, fit);
      if (!b) continue;
      ctx.lineWidth = Math.max(1, 3 * dpr);
      ctx.strokeStyle = "rgba(0,0,0,.55)";
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.lineWidth = Math.max(1, 1.5 * dpr);
      ctx.strokeStyle = "#f0a500";
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    }
    canvas.dataset.painted = String(Number(canvas.dataset.painted || 0) + 1);
  };
  img.src = r.thumbURL;
}

// The display size is an argument to the mapping, so anything that changes it
// invalidates every box already drawn. The thumbnail slot is a fixed 48 px, so
// a window resize does not move it — but devicePixelRatio does change when a
// window is dragged to a different display, and that changes the backing store
// this draws into. Repainting on resize is cheap and covers both.
let repaintTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(repaintTimer);
  repaintTimer = setTimeout(() => {
    for (const r of rows) if (r.canvas) paintBoxes(r);
    // The panel's canvas is sized from the viewport. Nothing has to be carried
    // across: the selection is stored in image pixels, so re-laying out the
    // canvas just re-projects it.
    if (!$("insp").hidden && insp.bmp) { layoutInspector(); paintInspector(); }
  }, 100);
});

/* pointing at a code the scanner could not read (or could not see) */

// One panel, one image at a time. A hundred rows each holding a
// full-resolution bitmap is what kills this page, which is why the row
// thumbnails are small and why this is torn down on close.
//
// THE SELECTION LIVES IN IMAGE PIXELS, not canvas pixels. That is the whole
// reason zoom and pan are possible: every time the view changes, a selection
// stored in canvas coordinates would have to be carried across by hand and
// would drift a little each time. Stored against the image, it is simply
// re-projected, and the projection is coords.js's tested mapping.
const insp = {
  row: null,
  bmp: null,       // the source ImageBitmap, at the file's own resolution
  view: null,      // where the image is drawn in the canvas, in canvas px
  selNat: null,    // THE selection, in image px
  zoom: 1,
  pan: { x: 0, y: 0 },
  drag: null,      // { mode, handle, lastX, lastY, at } while a pointer is down
  busy: false,
};

const INSP_MAX_ZOOM = 24;

// The frame record the mapping wants. The panel draws the file at its own
// resolution, so frame and natural are the same space here.
const inspFrame = () => ({ w: insp.bmp.width, h: insp.bmp.height, naturalW: insp.bmp.width, naturalH: insp.bmp.height });
const selDisp = () => (insp.selNat && insp.view ? Coords.naturalToDisplay(insp.selNat, inspFrame(), insp.view) : null);
const setSelFromDisp = (d) => { const n = d && Coords.displayToNatural(d, inspFrame(), insp.view); if (n) insp.selNat = n; };

async function openInspector(r) {
  if (!r.file) return;
  insp.row = r;
  insp.busy = false;
  insp.zoom = 1;
  insp.pan = { x: 0, y: 0 };
  insp.drag = null;
  $("inspName").textContent = r.name;
  setInspMsg("", "");
  $("insp").hidden = false;

  try {
    // The same createImageBitmap the decode used, which is what makes the
    // whole mapping safe without a rotation term: whatever this browser does
    // with EXIF orientation, the pixels drawn here and the pixels decoded
    // inherited the same decision. See coords.js.
    insp.bmp = await createImageBitmap(r.file);
  } catch {
    setInspMsg(t("err.unopenable"), "bad");
    return;
  }
  layoutInspector();
  // A located-but-unread code opens with its own box as the selection, so the
  // user adjusts a rectangle instead of tracing one. Everything else opens
  // with a centred box to drag.
  const pre = (r.detections && r.detections[0] && r.frame)
    ? Coords.frameToNatural(r.detections[0].box, r.frame)
    : null;
  insp.selNat = Select.initial(pre, { x: 0, y: 0, w: insp.bmp.width, h: insp.bmp.height });
  if (pre) {
    setInspMsg(t("insp.prefilled"), "");
    // Open zoomed onto what the scanner found, rather than making the user
    // zoom to the thing the tool is already pointing at.
    zoomToSelection();
  }
  paintInspector();
  $("inspCanvas").focus();
}

// layoutInspector sizes the canvas to the space available. The backing store
// follows devicePixelRatio, because a magnified crop drawn at CSS resolution
// is exactly the blur the zoom exists to remove.
function layoutInspector() {
  if (!insp.bmp) return;
  const canvas = $("inspCanvas");
  const dpr = window.devicePixelRatio || 1;
  const avail = Math.min($("inspBox").clientWidth - 32, 760);
  const cssW = Math.max(200, Math.round(avail));
  const cssH = Math.max(220, Math.round(Math.min(window.innerHeight * 0.56, cssW * 0.75)));
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  computeView();
}

// computeView is where zoom and pan turn into a rectangle. Everything else
// reads insp.view and never recomputes this itself.
function computeView() {
  const canvas = $("inspCanvas");
  const base = Coords.fitContain(insp.bmp.width, insp.bmp.height, canvas.width, canvas.height);
  if (!base) return;
  const w = base.w * insp.zoom, h = base.h * insp.zoom;
  let x = base.x + insp.pan.x, y = base.y + insp.pan.y;
  // Zoomed out, the image is centred. Zoomed in, it may be panned but its
  // edges may not come inside the frame: an image floating in the middle of a
  // grey field is disorienting and serves nothing.
  x = w <= canvas.width ? (canvas.width - w) / 2 : Math.min(0, Math.max(canvas.width - w, x));
  y = h <= canvas.height ? (canvas.height - h) / 2 : Math.min(0, Math.max(canvas.height - h, y));
  insp.pan = { x: x - base.x, y: y - base.y };
  insp.view = { x, y, w, h };
}

// zoomBy keeps the image point under (fx, fy) exactly where it is, which is
// what makes wheel-zoom feel like it is following the pointer rather than
// jumping.
function zoomBy(factor, fx, fy) {
  if (!insp.view) return;
  const canvas = $("inspCanvas");
  if (fx === undefined) { fx = canvas.width / 2; fy = canvas.height / 2; }
  const ix = (fx - insp.view.x) / insp.view.w;
  const iy = (fy - insp.view.y) / insp.view.h;
  const base = Coords.fitContain(insp.bmp.width, insp.bmp.height, canvas.width, canvas.height);
  insp.zoom = Math.min(INSP_MAX_ZOOM, Math.max(1, insp.zoom * factor));
  const w = base.w * insp.zoom, h = base.h * insp.zoom;
  insp.pan = { x: (fx - ix * w) - base.x, y: (fy - iy * h) - base.y };
  computeView();
  paintInspector();
}

function fitInspector() {
  insp.zoom = 1;
  insp.pan = { x: 0, y: 0 };
  computeView();
  paintInspector();
}

// zoomToSelection frames the current selection with a margin, which is the
// view a person wants the moment they open a row the scanner already flagged.
function zoomToSelection() {
  const canvas = $("inspCanvas");
  if (!insp.selNat) return;
  const base = Coords.fitContain(insp.bmp.width, insp.bmp.height, canvas.width, canvas.height);
  const margin = 1.8;
  const want = Math.min(
    canvas.width / (insp.selNat.w * (base.w / insp.bmp.width) * margin),
    canvas.height / (insp.selNat.h * (base.h / insp.bmp.height) * margin));
  insp.zoom = Math.min(INSP_MAX_ZOOM, Math.max(1, want));
  const w = base.w * insp.zoom, h = base.h * insp.zoom;
  // Centre the selection's middle in the canvas.
  const cx = (insp.selNat.x + insp.selNat.w / 2) / insp.bmp.width;
  const cy = (insp.selNat.y + insp.selNat.h / 2) / insp.bmp.height;
  insp.pan = { x: (canvas.width / 2 - cx * w) - base.x, y: (canvas.height / 2 - cy * h) - base.y };
  computeView();
}

function setInspMsg(text, cls) {
  const el = $("inspMsg");
  el.textContent = text;
  el.className = cls || "";
}

// Canvas pixels from a pointer event. The canvas has a CSS size and a backing
// store size and they are not the same number; using the wrong one is the
// classic way a selection lands where the user did not click.
function inspPoint(e) {
  const canvas = $("inspCanvas");
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height),
  };
}

// Handle size in canvas pixels. WCAG 2.2 asks for a 24x24 CSS px target as a
// minimum; the grab radius is larger than the drawn square so the target is
// comfortably past it on a touch screen, where the finger also hides the thing
// being aimed at - which is what the loupe below is for.
const HANDLE_DRAW = 7;   // half-size, CSS px
const HANDLE_GRAB = 16;  // radius, CSS px
const inspDpr = () => window.devicePixelRatio || 1;

function paintInspector() {
  const canvas = $("inspCanvas");
  if (!insp.bmp || !insp.view) return;
  const ctx = canvas.getContext("2d");
  const dpr = inspDpr();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = insp.zoom < 2; // past 2x, show the pixels honestly
  ctx.drawImage(insp.bmp, insp.view.x, insp.view.y, insp.view.w, insp.view.h);

  const s = selDisp();
  if (!s) return;

  // Everything outside the selection is dimmed, which says what will be read
  // far more directly than an outline does.
  ctx.fillStyle = "rgba(0,0,0,.5)";
  ctx.beginPath();
  ctx.rect(0, 0, canvas.width, canvas.height);
  ctx.rect(s.x + s.w, s.y, -s.w, s.h); // reverse winding punches the hole
  ctx.fill();

  ctx.lineWidth = Math.max(1, 2 * dpr);
  ctx.strokeStyle = "#f0a500";
  ctx.strokeRect(s.x, s.y, s.w, s.h);
  const hs = HANDLE_DRAW * dpr;
  ctx.fillStyle = "#f0a500";
  ctx.strokeStyle = "rgba(0,0,0,.6)";
  ctx.lineWidth = Math.max(1, dpr);
  for (const h of Select.handlePoints(s)) {
    ctx.fillRect(h.x - hs, h.y - hs, hs * 2, hs * 2);
    ctx.strokeRect(h.x - hs, h.y - hs, hs * 2, hs * 2);
  }
  if (insp.drag && insp.drag.at) paintLoupe(ctx, canvas, insp.drag.at);
}

// paintLoupe magnifies what is under the pointer, in the corner furthest from
// it. On a touch screen the finger covers the exact pixel being positioned,
// and every annotation tool that takes precision seriously solves that with a
// magnifier rather than by asking for a steadier hand.
function paintLoupe(ctx, canvas, at) {
  const dpr = inspDpr();
  const size = 108 * dpr, zoom = 3.5, pad = 10 * dpr;
  const left = at.x > canvas.width / 2 ? pad : canvas.width - size - pad;
  const top = at.y > canvas.height / 2 ? pad : canvas.height - size - pad;

  ctx.save();
  ctx.beginPath();
  ctx.rect(left, top, size, size);
  ctx.clip();
  ctx.fillStyle = "#000";
  ctx.fillRect(left, top, size, size);
  // Draw the same view again, scaled about the pointer, so what appears in the
  // loupe is exactly what is under the finger and not a second rendering that
  // could disagree with it.
  ctx.imageSmoothingEnabled = false;
  const vw = insp.view.w * zoom, vh = insp.view.h * zoom;
  const vx = left + size / 2 - (at.x - insp.view.x) * zoom;
  const vy = top + size / 2 - (at.y - insp.view.y) * zoom;
  ctx.drawImage(insp.bmp, vx, vy, vw, vh);

  const s = selDisp();
  if (s) {
    ctx.lineWidth = Math.max(1, 2 * dpr);
    ctx.strokeStyle = "#f0a500";
    ctx.strokeRect(vx + (s.x - insp.view.x) * zoom, vy + (s.y - insp.view.y) * zoom, s.w * zoom, s.h * zoom);
  }
  // Crosshair on the exact point being positioned.
  ctx.strokeStyle = "rgba(255,255,255,.9)";
  ctx.lineWidth = Math.max(1, dpr);
  ctx.beginPath();
  ctx.moveTo(left + size / 2 - 8 * dpr, top + size / 2);
  ctx.lineTo(left + size / 2 + 8 * dpr, top + size / 2);
  ctx.moveTo(left + size / 2, top + size / 2 - 8 * dpr);
  ctx.lineTo(left + size / 2, top + size / 2 + 8 * dpr);
  ctx.stroke();
  ctx.restore();

  ctx.strokeStyle = "rgba(255,255,255,.75)";
  ctx.lineWidth = Math.max(1, dpr);
  ctx.strokeRect(left, top, size, size);
}

function closeInspector() {
  $("insp").hidden = true;
  if (insp.bmp) insp.bmp.close();
  insp.bmp = null;
  insp.row = null;
  insp.selNat = null;
  insp.view = null;
  insp.drag = null;
}

// A row is built once and rewritten in place, so the file appears in the list
// the moment it is queued and gains its answer where it already sits.
function renderRow(r) {
  if (!r.el) {
    r.el = document.createElement("li");
    $("list").appendChild(r.el);
  }
  const li = r.el;
  li.style.order = rowRank(r);
  li.replaceChildren();
  li.classList.toggle("pending", !!r.pending);

  const wrap = document.createElement("div");
  wrap.className = "thumbwrap";
  if (r.thumbURL && showsBox(r)) {
    // The one row type that gets geometry drawn on it. See showsBox.
    const canvas = document.createElement("canvas");
    canvas.className = "thumb";
    // Decorative: the row already says in words why it has no payload, and a
    // screen reader has nothing to gain from a rectangle.
    canvas.setAttribute("aria-hidden", "true");
    r.canvas = canvas;
    wrap.appendChild(canvas);
    paintBoxes(r);
  } else if (r.thumbURL) {
    r.canvas = null;
    const img = document.createElement("img");
    img.src = r.thumbURL;
    img.alt = "";
    wrap.appendChild(img);
  } else {
    r.canvas = null;
    const box = document.createElement("div");
    box.className = r.pending ? "shim" : "noimg";
    wrap.appendChild(box);
  }
  li.appendChild(wrap);

  const meta = document.createElement("div");
  meta.className = "meta";
  const line = document.createElement("div");
  line.className = "nameline";
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = r.name;
  // Offered on every row that still has its file. The case this most needs to
  // serve is the one where nothing was detected and the person can see a code
  // anyway; restricting it to flagged rows would withhold it exactly there.
  if (r.file) {
    const point = document.createElement("button");
    // On a row holding a code nobody could read, pointing at it is THE action,
    // so it looks like one. Elsewhere it is a quiet offer.
    point.className = isUnread(r) ? "point lead" : "point";
    point.type = "button";
    point.textContent = t("insp.open");
    point.onclick = () => openInspector(r);
    r.pointBtn = point;
  }
  line.appendChild(name);
  // Only once the row has settled: offering to point at a code while the
  // scanner is still reading the file invites the user to race it.
  if (r.pointBtn && !r.pending) line.appendChild(r.pointBtn);
  if (!r.pending) {
    // The one mark the machine does not set. Everything else on this row is
    // the scanner's opinion; this is the reader's.
    const flag = document.createElement("button");
    flag.type = "button";
    flag.className = r.flagged ? "point flagged" : "point";
    flag.textContent = r.flagged ? "★" : "☆";
    flag.title = t(r.flagged ? "row.unflag" : "row.flag");
    flag.setAttribute("aria-label", flag.title);
    flag.setAttribute("aria-pressed", String(!!r.flagged));
    flag.onclick = () => toggleFlag(r);
    line.appendChild(flag);
  }
  if (r.path && r.path !== r.name) {
    const where = document.createElement("span");
    where.className = "where";
    where.textContent = r.path.slice(0, r.path.length - r.name.length - 1);
    line.appendChild(where);
  }
  if (!r.pending && !r.error) line.appendChild(svgPath(ICONS.tick, "tick"));
  else if (r.pending) { const sp = document.createElement("div"); sp.className = "spin"; line.appendChild(sp); }
  meta.appendChild(line);

  if (!r.pending) {
    // Only while renaming is open. With it closed the line is a preview of a
    // decision nobody has taken, repeated on every row.
    const renamed = newNameFor(r);
    if (r.file && renamed !== r.name && $("renameWrap").open) {
      const pv = document.createElement("div");
      pv.className = "renamed";
      pv.textContent = t("rename.preview") + " ";
      const code = document.createElement("code");
      code.textContent = renamed;
      pv.appendChild(code);
      meta.appendChild(pv);
    }
    if (r.error) {
      const bad = document.createElement("div");
      bad.className = "tagline err";
      // A translated sentence when the worker named one; the raw text only for
      // the decoder's own errors, which are diagnostics rather than copy.
      bad.textContent = r.errorKey ? t(r.errorKey) : r.error;
      meta.appendChild(bad);
      const advice = document.createElement("div");
      advice.className = "advice";
      // Not the re-shoot line: this file never opened, so there is no photo to
      // retake and nothing about the framing to fix. What is left is the
      // format, which is a thing a person can actually change.
      advice.textContent = t("err.fileAdvice");
      meta.appendChild(advice);
    } else if (!r.codes.length) {
      // Two situations, and only one of them is the user's to fix. A code that
      // was located and could not be read is worth re-shooting; an image that
      // holds no code is not, and telling someone to retake a photo of a code
      // that was never there is the whole bug this branch exists to end.
      const found = isUnread(r);
      const no = document.createElement("div");
      no.className = found ? "tagline found" : "tagline no";
      no.textContent = t(found ? "res.detected" : "res.noCode");
      meta.appendChild(no);
      // Only the actionable state gets a second line. "No code found" already
      // declines to assert the absence — found is a claim about the search, not
      // about the image — so an advice line under it restated the label in more
      // words and offered nothing to do. A row with no action reads quietest.
      if (found) {
        const advice = document.createElement("div");
        advice.className = "advice";
        advice.textContent = t("err.advice");
        meta.appendChild(advice);
      }
    } else {
      for (const c of r.codes) meta.appendChild(hitBox(c));
    }
  }
  li.appendChild(meta);

}

function repaintAll() {
  for (const r of rows) renderRow(r);
  paintStats();
  applyFilters();
}

/* exporting */

function serialise(format) {
  const stamp = (r) => (r.at ? r.at.toISOString() : "");
  const settled = rows.filter((r) => !r.pending);
  if (format === "json") {
    return JSON.stringify(settled.map((r) => ({
      file: r.name, path: r.path || r.name, first_seen: stamp(r), order: r.seq,
      codes: r.codes.map((c) => ({ payload: c, type: Payload.describe(c).kind,
                                   seen_in_images: seenCount.get(c) || 1 })),
      error: r.error || undefined,
    })), null, 2);
  }
  if (format === "csv") {
    const cell = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
    const lines = ["file,path,type,payload,seen_in_images,first_seen,error"];
    for (const r of settled) {
      if (r.codes.length) {
        for (const c of r.codes) {
          lines.push([cell(r.name), cell(r.path || r.name), cell(Payload.describe(c).kind),
            cell(c), seenCount.get(c) || 1, cell(stamp(r)), '""'].join(","));
        }
      } else {
        lines.push([cell(r.name), cell(r.path || r.name), '""', '""', 0, cell(stamp(r)), cell(r.error)].join(","));
      }
    }
    return lines.join("\n");
  }
  return settled.filter((r) => r.codes.length)
    .map((r) => (r.path || r.name) + "\n" + r.codes.join("\n")).join("\n\n");
}

function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

const drop = $("drop");
for (const ev of ["dragenter", "dragover"]) {

}
document.addEventListener("dragleave", (e) => { if (e.relatedTarget === null) drop.classList.remove("over"); });
document.addEventListener("drop", async (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  accept(await fromDataTransfer(e.dataTransfer));
});

document.addEventListener("paste", (e) => {
  const items = [...(e.clipboardData ? e.clipboardData.files : [])].filter(worthTrying);
  if (!items.length) return;
  e.preventDefault();
  accept(items.map((f) => ({ file: f, path: f.name })));
});

$("pasteBtn").onclick = async () => {
  // From a button no paste event fires, so the async clipboard is the only
  // route; it needs permission and is not available everywhere.
  try {
    const items = await navigator.clipboard.read();
    const out = [];
    for (const it of items) {
      const type = it.types.find((x) => x.startsWith("image/"));
      if (!type) continue;
      const blob = await it.getType(type);
      out.push({ file: new File([blob], "incollata." + type.split("/")[1], { type }), path: "clipboard" });
    }
    accept(out);
  } catch {
    $("emptyText").textContent = t("res.nothing");
  }
};

// On a frozen frame the overlay behaves like the area picker: drag a box, and
// reading it goes through the same crop path.
$("scanCanvas").addEventListener("pointerdown", (e) => {
  if (!live.frozen) return;
  const rect = stageRect();
  if (!rect) return;
  const c = $("scanCanvas"), r = c.getBoundingClientRect();
  const p = { x: (e.clientX - r.left) * (c.width / r.width), y: (e.clientY - r.top) * (c.height / r.height) };
  const space = { w: live.frozen.width, h: live.frozen.height, naturalW: live.frozen.width, naturalH: live.frozen.height };
  const cur = live.selNat && Coords.naturalToDisplay(live.selNat, space, rect);
  const grab = cur ? Select.hit(cur, p.x, p.y, 16 * (window.devicePixelRatio || 1)) : null;
  if (!grab) {
    live.selNat = Coords.displayToNatural(Select.clamp({ x: p.x, y: p.y, w: Select.MIN, h: Select.MIN }, rect), space, rect);
    live.drag = { handle: "se", lastX: p.x, lastY: p.y };
  } else {
    live.drag = { handle: grab, lastX: p.x, lastY: p.y };
  }
  c.setPointerCapture(e.pointerId);
});

$("scanCanvas").addEventListener("pointermove", (e) => {
  if (!live.drag || !live.frozen) return;
  const rect = stageRect();
  const c = $("scanCanvas"), r = c.getBoundingClientRect();
  const p = { x: (e.clientX - r.left) * (c.width / r.width), y: (e.clientY - r.top) * (c.height / r.height) };
  const dx = p.x - live.drag.lastX, dy = p.y - live.drag.lastY;
  live.drag.lastX = p.x; live.drag.lastY = p.y;
  const space = { w: live.frozen.width, h: live.frozen.height, naturalW: live.frozen.width, naturalH: live.frozen.height };
  const cur = Coords.naturalToDisplay(live.selNat, space, rect);
  const next = live.drag.handle === "move" ? Select.move(cur, dx, dy, rect) : Select.resize(cur, live.drag.handle, dx, dy, rect);
  live.selNat = Coords.displayToNatural(next, space, rect);
});

for (const ev of ["pointerup", "pointercancel"]) {
  $("scanCanvas").addEventListener(ev, async () => {
    if (!live.drag || !live.frozen || !live.selNat) { live.drag = null; return; }
    live.drag = null;
    // Reading the hand-drawn box goes through the same crop job the picker
    // uses, so a code found this way is found the same way.
    const c = document.createElement("canvas");
    c.width = live.frozen.width; c.height = live.frozen.height;
    c.getContext("2d").drawImage(live.frozen, 0, 0);
    const blob = await new Promise((res) => c.toBlob(res, "image/png"));
    const id = "cam" + ++live.seq;
    cropWaiting.set(id, (msg) => {
      const fresh = (msg.codes || []).filter((x) => !live.found.has(x));
      if (!fresh.length) { $("camMsg").textContent = t("insp.none"); return; }
      for (const x of fresh) { live.found.set(x, true); enqueueDecodedFromCamera(x); const d = document.createElement("div"); d.textContent = x; $("scanFound").prepend(d); }
      $("camMsg").textContent = t("insp.found", { n: fresh.length });
    });
    queue.push({ type: "crop", id, blob, rect: live.selNat });
    pump();
  });
}

/* the area picker's controls */

$("inspClose").onclick = closeInspector;
$("insp").onclick = (e) => { if (e.target === $("insp")) closeInspector(); };
$("inspZoomIn").onclick = () => zoomBy(1.5);
$("inspZoomOut").onclick = () => zoomBy(1 / 1.5);
$("inspFit").onclick = fitInspector;

// Space held down turns the whole canvas into a pan surface, the convention
// every drawing tool shares. Without it, dragging the background has to mean
// one thing, and here it means "draw a box" because that is the primary act.
let inspSpace = false;
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !$("insp").hidden) { inspSpace = true; $("inspCanvas").style.cursor = "grab"; e.preventDefault(); }
});
document.addEventListener("keyup", (e) => {
  if (e.code === "Space") { inspSpace = false; $("inspCanvas").style.cursor = ""; }
});

// Two fingers pan and pinch; one finger draws. Tracked here rather than in
// select.js because it is pointer bookkeeping, not geometry.
const inspTouches = new Map();

$("inspCanvas").addEventListener("pointerdown", (e) => {
  if (!insp.view) return;
  $("inspCanvas").setPointerCapture(e.pointerId);
  inspTouches.set(e.pointerId, inspPoint(e));
  if (inspTouches.size === 2) { insp.drag = { mode: "pinch", start: pinchState() }; paintInspector(); return; }

  const p = inspPoint(e);
  if (inspSpace || e.button === 1) { insp.drag = { mode: "pan", lastX: p.x, lastY: p.y }; return; }

  const s = selDisp();
  const grab = s ? Select.hit(s, p.x, p.y, HANDLE_GRAB * inspDpr()) : null;
  if (!grab) {
    // Outside the current selection starts a fresh one from that corner, which
    // is what every drawing tool does and what makes a bad first box cheap to
    // redo.
    setSelFromDisp(Select.clamp({ x: p.x, y: p.y, w: Select.MIN, h: Select.MIN }, insp.view));
    insp.drag = { mode: "resize", handle: "se", lastX: p.x, lastY: p.y, at: p };
  } else {
    insp.drag = { mode: grab === "move" ? "move" : "resize", handle: grab, lastX: p.x, lastY: p.y, at: p };
  }
  paintInspector();
});

function pinchState() {
  const [a, b] = [...inspTouches.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
}

$("inspCanvas").addEventListener("pointermove", (e) => {
  if (!insp.drag || !insp.view) return;
  const p = inspPoint(e);
  inspTouches.set(e.pointerId, p);

  if (insp.drag.mode === "pinch") {
    if (inspTouches.size < 2) return;
    const now = pinchState(), was = insp.drag.start;
    if (was.d > 0) zoomBy(now.d / was.d, now.cx, now.cy);
    insp.drag.start = now;
    return;
  }
  if (insp.drag.mode === "pan") {
    insp.pan.x += p.x - insp.drag.lastX;
    insp.pan.y += p.y - insp.drag.lastY;
    insp.drag.lastX = p.x; insp.drag.lastY = p.y;
    computeView();
    paintInspector();
    return;
  }

  const dx = p.x - insp.drag.lastX, dy = p.y - insp.drag.lastY;
  insp.drag.lastX = p.x; insp.drag.lastY = p.y;
  insp.drag.at = p;
  const s = selDisp();
  if (!s) return;
  setSelFromDisp(insp.drag.mode === "move"
    ? Select.move(s, dx, dy, insp.view)
    : Select.resize(s, insp.drag.handle, dx, dy, insp.view));
  paintInspector();
});

for (const ev of ["pointerup", "pointercancel"]) {
  $("inspCanvas").addEventListener(ev, (e) => {
    inspTouches.delete(e.pointerId);
    if (inspTouches.size < 2) insp.drag = null;
    paintInspector();
  });
}

// Wheel zooms at the pointer; with no modifier a trackpad's two-finger scroll
// pans, which is what a trackpad user expects a two-finger gesture to do.
$("inspCanvas").addEventListener("wheel", (e) => {
  if (!insp.view) return;
  e.preventDefault();
  const p = inspPoint(e);
  if (e.ctrlKey || e.metaKey || e.deltaMode !== 0) {
    zoomBy(Math.exp(-e.deltaY * 0.002), p.x, p.y);
  } else {
    insp.pan.x -= e.deltaX;
    insp.pan.y -= e.deltaY;
    computeView();
    paintInspector();
  }
}, { passive: false });

// A keyboard alternative, because a rectangle that can only be dragged is a
// feature some people cannot use at all.
$("inspCanvas").addEventListener("keydown", (e) => {
  const s = selDisp();
  if (!s) return;
  const step = (e.altKey ? 1 : 8) * inspDpr();
  const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (d) {
    setSelFromDisp(e.shiftKey ? Select.resize(s, "se", d[0], d[1], insp.view) : Select.move(s, d[0], d[1], insp.view));
    paintInspector();
    e.preventDefault();
    return;
  }
  if (e.key === "+" || e.key === "=") { zoomBy(1.5); e.preventDefault(); }
  else if (e.key === "-") { zoomBy(1 / 1.5); e.preventDefault(); }
  else if (e.key === "0") { fitInspector(); e.preventDefault(); }
  else if (e.key === "Enter") { rescanSelection(); e.preventDefault(); }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("insp").hidden) closeInspector();
});

$("inspRescan").onclick = rescanSelection;

// rescanSelection sends the chosen region back through the same engine, at the
// source's own resolution.
//
// It is a worker job like any other: nothing is uploaded, on either surface.
// The hosted page and the --serve page run the identical wasm build in the
// identical worker, so there is no network path here to relax the CSP for.
function rescanSelection() {
  const r = insp.row;
  if (!r || !insp.selNat || !insp.bmp || insp.busy) return;
  // Already in source pixels: the selection is stored against the image, not
  // against the canvas, so zoom and pan never touched it.
  const nat = insp.selNat;

  insp.busy = true;
  $("inspRescan").disabled = true;
  setInspMsg(t("insp.working"), "");
  // Through the same queue as every other job, so it waits its turn behind a
  // running scan instead of racing one on a worker that is already busy.
  queue.push({ type: "crop", id: r.id, blob: r.file, rect: nat });
  pump();
}

// adoptCropResult folds an assisted decode into the row it came from.
//
// The result is a normal decoded code: same row, same copy button, same
// payload recogniser, same exports. Indistinguishable downstream, which is the
// point — a code the user had to point at is still just a code.
function adoptCropResult(r, msg) {
  insp.busy = false;
  $("inspRescan").disabled = false;
  if (!r) return; // the run was cleared while the crop was decoding
  const read = msg.codes || [];
  const fresh = read.filter((c) => !r.codes.includes(c));
  if (!read.length) {
    setInspMsg(msg.errorKey ? t(msg.errorKey) : t("insp.none"), "bad");
    return;
  }
  // What the message reports is what the AREA held, not what the row gained.
  // Re-reading a code the row already had is a successful read of that area,
  // and saying "still nothing readable" there would be a plain falsehood: the
  // user is looking at the code while the tool denies finding it.
  setInspMsg(t("insp.found", { n: read.length }), "ok");
  if (!fresh.length) return;
  const found = fresh;
  r.codes = r.codes.concat(found);
  r.reason = "DECODED";
  r.error = "";
  r.errorKey = "";
  for (const c of found) seenCount.set(c, (seenCount.get(c) || 0) + 1);
  renderRow(r);
  paintStats();
  applyFilters();
}
$("pattern").onchange = repaintAll;
$("zip").onclick = downloadZip;
$("save").onclick = () => saveBlob(
  new Blob([serialise($("fmt").value)], { type: "text/plain;charset=utf-8" }),
  "codici-qr." + $("fmt").value);
$("copyAll").onclick = async (e) => {
  const all = visibleRows().flatMap((r) => r.codes);
  await navigator.clipboard.writeText(all.join("\n"));
  const b = e.currentTarget;
  b.textContent = t("act.copied") + " " + all.length;
  setTimeout(() => (b.textContent = t("act.copyAll")), 1400);
};

// Clearing throws away work that cannot be got back without scanning again, so
// it asks first, next to the button rather than in a system dialog that stops
// the whole page.
$("clear").onclick = () => $("clearPop").classList.toggle("hide");
$("clearNo").onclick = () => $("clearPop").classList.add("hide");
document.addEventListener("click", (e) => {
  if (!$("clearPop").contains(e.target) && e.target !== $("clear")) $("clearPop").classList.add("hide");
});
$("clearYes").onclick = () => {
  for (const r of rows) if (r.thumbURL) URL.revokeObjectURL(r.thumbURL);
  rows.length = 0;
  queue.length = 0;
  batches.length = 0;
  byId.clear();
  seenCount.clear();
  done = expected = 0;
  activeTile = "fAll";
  $("list").replaceChildren();
  $("out").classList.add("hide");
  $("work").classList.add("hide");
  $("clearPop").classList.add("hide");
  $("empty").classList.remove("hide");
  $("emptyText").textContent = t("res.empty");
  paintStats();
  applyFilters();
};

/* language */

// The list is built from whatever strings.js defines, so adding a language
// there is the whole job.
function buildLangMenu() {
  const sel = $("lang");
  sel.replaceChildren();
  for (const l of I18N.languages()) {
    const o = document.createElement("option");
    o.value = l.code;
    o.textContent = l.name;
    sel.appendChild(o);
  }
  sel.value = I18N.lang;
}
function paintLang() { $("lang").value = I18N.lang; }
$("lang").onchange = (e) => I18N.setLang(e.target.value);
// apply() rewrites every data-t node, which would put the singular folder
// label back. Re-derive the ones that depend on state after it runs.
I18N.onChange(() => { if (typeof rows !== "undefined") applyFilters(); });
I18N.onChange(() => {
  paintLang();
  if (enginesReady) { $("engine").textContent = t("engine.ready"); $("engine").classList.add("ready"); }
  if (rows.length) repaintAll(); else $("emptyText").textContent = t("res.empty");
});
I18N.apply();
buildLangMenu();
applyFilters();   // gives the folder button its label before anything is loaded
$("emptyText").textContent = t("res.empty");
$("zip").textContent = t("rename.zip", { n: 0 });

/* the local app, when there happens to be one */

const frag = new URLSearchParams(location.hash.slice(1));
const token = frag.get("t") || "";
const api = (frag.get("api") || location.origin).replace(/\/$/, "");
let session = null;

async function call(path, body) {
  const res = await fetch(api + path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-QMI-Token": token, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) throw new Error((await res.text()).trim() || res.status);
  return res;
}

async function findLocalApp() {
  if (!token) return;
  try {
    const info = await (await call("/api/health")).json();
    localAppFound = true;
    // A real version or nothing. "vdev" is a build label, and putting it in
    // the header tells a user something true about the binary and nothing they
    // can act on - while looking like the product is unfinished.
    $("ver").textContent = /^\d/.test(String(info.version || "")) ? "v" + info.version : "";
    paintEngineState();
  } catch { /* the normal case, and the page is fully usable without one */ }
}


findLocalApp();
