# Goreleaser config — builds and uploads cross-platform binaries on tag push.
# https://goreleaser.com
version: 2

project_name: qr-multi-imgs

before:
  hooks:
    - go mod tidy

builds:
  # macOS: cgo links Apple's Vision framework for real-photo QR decoding.
  # Must run on a macOS runner (the SDK is unavailable when cross-compiling).
  - id: darwin
    env: [CGO_ENABLED=1]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # Linux/Windows stay pure Go (Vision is stubbed out), so they cross-compile
  # from the same macOS runner with no C toolchain.
  - id: cross
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Publishes the formula to the public tap on every release, so brew users
# stop drifting behind (the formula was previously maintained by hand and
# went stale/missing). Requires the GH_PAT repo secret (push rights on
# thousandflowers/homebrew-tap), exposed as TAP_GITHUB_TOKEN in release.yml.
brews:
  - name: qr-multi-imgs
    repository:
      owner: thousandflowers
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/thousandflowers/qr-multi-imgs
    description: "TUI to scan QR codes from an images folder, organize and export results"
    license: MIT
    install: |
      bin.install "qr-multi-imgs"
    test: |
      assert_match version.to_s, shell_output("#{bin}/qr-multi-imgs --version")

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
