# Goreleaser config — builds and uploads cross-platform binaries on tag push.
# https://goreleaser.com
version: 2

project_name: qr-multi-imgs

before:
  hooks:
    - go mod tidy

builds:
  # macOS: cgo links Apple's Vision framework for real-photo QR decoding.
  # Must run on a macOS runner (the SDK is unavailable when cross-compiling).
  - id: darwin
    env: [CGO_ENABLED=1]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # Linux/Windows stay pure Go (Vision is stubbed out), so they cross-compile
  # from the same macOS runner with no C toolchain.
  - id: cross
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
