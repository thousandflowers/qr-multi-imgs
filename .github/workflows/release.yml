name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS runner: darwin builds need cgo + the Vision SDK; linux/windows
    # cross-compile here too (pure Go). Apple Silicon runner has the universal
    # SDK, so it can target both darwin/arm64 and darwin/amd64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The formula bump runs at the END of goreleaser, after the GitHub
      # release is already published. Without the token that leaves brew
      # pinned to the previous version with a green-looking release, so
      # refuse before anything ships.
      - name: Require the tap token
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error::GH_PAT is not set. goreleaser would publish the release and then fail to bump the Homebrew formula. Set it with: gh secret set GH_PAT --repo thousandflowers/qr-multi-imgs"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with push rights on thousandflowers/homebrew-tap; used by the
          # brews section of .goreleaser.yaml to publish the formula.
          TAP_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
