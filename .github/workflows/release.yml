name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS runner: darwin builds need cgo + the Vision SDK; linux/windows
    # cross-compile here too (pure Go). Apple Silicon runner has the universal
    # SDK, so it can target both darwin/arm64 and darwin/amd64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Homebrew formula is bumped from a machine, not from here. Pushing to
      # the tap needs a long-lived token with write access to another repo, and
      # that token only ever fails at the END of goreleaser — after the release
      # is published — leaving brew on the old version behind a green release.
      # scripts/bump_tap.py does the same job with the operator's own gh auth.
      - name: Say what still has to happen
        run: |
          {
            echo "### Released ${GITHUB_REF_NAME}"
            echo
            echo "Homebrew is still on the previous version. Bump the tap:"
            echo
            echo '```'
            echo "scripts/bump_tap.py qr-multi-imgs --tag ${GITHUB_REF_NAME}"
            echo "brew update && brew upgrade qr-multi-imgs && qr-multi-imgs --version"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
