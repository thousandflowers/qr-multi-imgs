name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The corpus harness is behind a build tag, so `go vet ./...` never
      # compiles it and a break in it would only surface the next time someone
      # tried to measure something.
      - name: Vet the corpus harness
        run: go vet -tags corpus ./scanner

      # The browser engine is a separate build target, so nothing else here
      # would notice it breaking until a Pages deploy failed.
      - name: Build the wasm engine
        if: runner.os == 'Linux'
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./wasm

      # The page's own logic - what a payload means, how a file gets named,
      # whether both languages are complete - is not Go, so `go test` would
      # never notice it breaking. Each module is its own runnable check.
      - name: Check the browser modules
        if: runner.os == 'Linux'
        run: |
          node web/payload.js --test
          node web/zip.js --test
          node web/unzip.js --test
          node web/i18n.js --test
          node web/order.js --test
          node web/result.js --test
          node web/coords.js --test
          node web/select.js --test
          node web/qrgen.js --test

      - name: Test
        run: go test -v -count=1 -coverprofile=${{ runner.temp }}/coverage.txt . ./exporter ./scanner ./cmd/...

      - name: Upload coverage to Codecov
        if: runner.os != 'Windows'
        uses: codecov/codecov-action@v5
        with:
          files: ${{ runner.temp }}/coverage.txt
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
