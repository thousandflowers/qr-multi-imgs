name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Check syntax
        run: python3 -c "import py_compile; py_compile.compile('qr_multi_imgs.py', doraise=True)"

      - name: Run tests
        run: pytest test_qr_multi_imgs.py -v

      - name: Type check (best-effort)
        continue-on-error: true
        run: basedpyright qr_multi_imgs.py
